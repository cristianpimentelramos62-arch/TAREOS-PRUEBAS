    function nuevaFilaTareo() {
      const l0 = S.labores[0] || { nombre: "COSECHA ARANDANO", codigo: "101" };
      return { dni: "", nombre: "", estado: "", labor: l0.nombre, codigo: l0.codigo, horas: "8" };
    }

    function resolverTrabajadorPorDni(dni) {
      const clean = String(dni || "").replace(/\D/g, "");
      if (!clean) return null;
      return S.personalMap.get(clean) || null;
    }

    function resolverCodigoLabor(nombreLabor, codigoActual) {
      const hit = S.laboresMap.get(normK(nombreLabor));
      return hit || codigoActual || "";
    }

    async function abrirCarpetaTareos30Dias(forzarDrive = false) {
      const modal = $("folder-modal");
      const listEl = $("folder-list");
      const subEl = $("folder-sub");
      if (!modal || !listEl) return;

      const activePin = S.pin;
      const st = S.tareo;
      modal.style.display = "flex";

      const cerrar = () => { modal.style.display = "none"; };
      $("folder-close").onclick = cerrar;
      modal.onclick = e => { if (e.target === modal) cerrar(); };

      const pintarListaCarpeta = hist => {
        st.historial = hist || [];
        if (subEl) subEl.textContent = `${st.historial.length} tareo(s) guardados en los últimos 30 días`;
        if (!st.historial.length) {
          listEl.innerHTML = `<div class="m" style="padding:18px 8px;text-align:center">No tienes tareos guardados en los últimos 30 días.</div>`;
          return;
        }
        listEl.innerHTML = st.historial.map(h => {
          const filas = h.filas || [];
          const hrs = filas.reduce((s, r) => s + toNum(r.horas), 0);
          const fnd = h.fundo || (filas[0] && filas[0].fundo) || S.fundo || "Sin fundo";
          const isCurrent = h.fecha === st.fecha;
          return `
            <div class="folder-item ${isCurrent ? "active-item" : ""}">
              <div style="min-width:0;flex:1">
                <div style="font-weight:800;font-size:12px">📅 ${fmtDMY(h.fecha)} ${isCurrent ? `<span class="badge b-env">ABIERTO</span>` : ""}</div>
                <div class="m" style="font-size:10.5px;margin-top:2px">
                  <b>${esc(fnd)}</b> · ${filas.length} trab. · <b>${hrs.toFixed(1).replace(/\.0$/, "")}h</b>
                </div>
              </div>
              <div class="row" style="flex-shrink:0">
                <button type="button" class="btn btn-xs" data-fedit="${esc(h.fecha)}">✎ Editar</button>
                <button type="button" class="btn btn-d btn-xs" data-fdel="${esc(h.fecha)}" title="Eliminar">✕</button>
              </div>
            </div>
          `;
        }).join("");

        listEl.querySelectorAll("[data-fedit]").forEach(b => {
          b.onclick = () => {
            const fSel = b.dataset.fedit;
            const hit = (st.historial || []).find(x => x.fecha === fSel);
            st.fecha = fSel;
            st.filas = hit && Array.isArray(hit.filas) ? hit.filas.map(x => ({ ...x })) : [];
            st.dirty = false;
            st.estado = st.filas.length ? "GUARDADO" : "NUEVO";
            cerrar();
            S.activeTab = "tareo";
            renderShell();
            toast(`✓ Tareo del ${fmtDMY(fSel)} abierto para editar`);
          };
        });

        listEl.querySelectorAll("[data-fdel]").forEach(b => {
          b.onclick = async () => {
            const fDel = b.dataset.fdel;
            if (!(await confirmar("Eliminar tareo", `¿Eliminar el tareo guardado del ${fmtDMY(fDel)}?`))) return;
            const cKey = `${CACHE.TAREO_PREFIX}${S.demo ? "demo" : "live"}_${fDel}_${activePin}`;
            store.remove(cKey);
            await api({ accion: "guardarTareo", pin: activePin, usuario: S.nombre, fecha: fDel, filas: [] });
            st.historial = (st.historial || []).filter(x => x.fecha !== fDel);
            if (st.fecha === fDel) {
              st.filas = [nuevaFilaTareo()];
              st.estado = "NUEVO";
              st.dirty = false;
              if (S.activeTab === "tareo") renderTareo(++S.renderToken);
            }
            pintarListaCarpeta(st.historial);
            toast("Tareo eliminado");
          };
        });
      };

      const locales = obtenerHistorialLocalUsuario("tareos", activePin)
        .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
      pintarListaCarpeta(st.historial && st.historial.length && !forzarDrive ? st.historial : locales);

      $("folder-refresh").onclick = () => abrirCarpetaTareos30Dias(true);

      const histRemoto = await cargarHistorial30DiasUsuario("tareos", activePin);
      if (S.pin === activePin && modal.style.display === "flex") {
        pintarListaCarpeta(histRemoto);
      }
    }

    function renderTareo(token) {
      const pane = $("pane-tareo");
      if (!pane) return;
      const st = S.tareo;
      const activePin = S.pin;
      const cKey = `${CACHE.TAREO_PREFIX}${S.demo ? "demo" : "live"}_${st.fecha}_${activePin}`;
      const cached = store.get(cKey, null);
      if (!st.filas.length && cached && Array.isArray(cached.filas) && cached.filas.length) {
        st.filas = cached.filas;
        st.estado = cached.estado || "GUARDADO";
      }
      if (!st.filas.length) st.filas = [nuevaFilaTareo()];

      const scope = getUserAllowedScope();
      const badge = st.dirty ? `<span id="tar-badge" class="badge b-bor">SIN GUARDAR</span>`
        : st.estado === "GUARDADO" ? `<span id="tar-badge" class="badge b-env">GUARDADO</span>`
        : `<span id="tar-badge" class="badge b-new">NUEVO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp">
            <div class="row">
              <input type="date" id="tar-fecha" value="${st.fecha}" />
              ${badge}
            </div>
            <div class="row">
              <button id="tar-folder-btn" type="button" class="btn btn-s btn-xs" title="Abrir carpeta de tareos (últimos 30 días)">📁 Carpeta (${(st.historial || []).length})</button>
              <span class="badge b-env">${esc(isAdmin() ? "TODAS" : (scope.fundos.join(", ") || S.zona))}</span>
            </div>
          </div>
        </div>

        <div class="masivo-banner">
          <div class="row sp" style="flex-wrap:nowrap">
            <div style="min-width:0;flex:1">
              <div style="font-weight:800;font-size:12px;color:var(--primary)">Masivo Tareo</div>
              <div class="m" style="font-size:10.5px">Columnas: C.LABOR, DNI, NOMBRES, HORAS</div>
            </div>
            <button id="tar-tpl" type="button" class="btn btn-s btn-xs">⬇ Plantilla</button>
            <label for="tar-file" class="btn">📥 Masivo</label>
            <input type="file" id="tar-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
          </div>
        </div>

        <div id="tar-list"></div>

        <div class="card">
          <div class="row sp" style="margin-bottom:8px">
            <span class="m">Total trabajadores: <b id="tar-cnt" style="color:var(--text)">0</b></span>
            <span class="m">Total horas: <b id="tar-hrs" style="color:var(--primary)">0</b></span>
          </div>
          <button id="tar-add" type="button" class="btn btn-s" style="width:100%">+ Agregar trabajador</button>
          <div class="row" style="margin-top:6px;gap:6px">
            <button id="tar-save" type="button" class="btn" style="flex:1">${st.estado === "GUARDADO" ? "Actualizar / Guardar en Drive" : "Guardar Tareo en Drive"}</button>
            <button id="tar-xls" type="button" class="btn btn-info">⬇ Excel</button>
            ${st.estado === "GUARDADO" ? `<button id="tar-del" type="button" class="btn btn-d btn-xs">Borrar</button>` : ""}
          </div>
        </div>
      `;

      const pintarFilasTareo = () => {
        const list = $("tar-list");
        if (!list) return;
        const laborOpts = S.labores.map(l => `<option value="${esc(l.nombre)}">${esc(l.nombre)}</option>`).join("");

        list.innerHTML = st.filas.map((r, i) => {
          const estBad = r.estado && /CESAD|BAJA|INACT/i.test(r.estado);
          return `
            <div class="t-item" data-ti="${i}">
              <div class="t-top">
                <span class="t-num">${i + 1}</span>
                <input class="dni-in" data-tf="dni" data-ti="${i}" inputmode="numeric" maxlength="12" placeholder="DNI (8 dígitos)" value="${esc(r.dni)}" style="flex:1" />
                <button type="button" class="btn btn-d btn-xs" data-tdel="${i}">✕</button>
              </div>
              <div class="t-name">
                <span data-tc="nom" style="color:${r.nombre ? "var(--text)" : "var(--muted)"}">${esc(r.nombre || "Escribe el DNI para buscar nombre...")}</span>
                ${r.estado ? `<span class="badge ${estBad ? "b-bor" : "b-env"}">${esc(r.estado)}</span>` : ""}
              </div>
              <div class="t-bot">
                <select data-tf="labor" data-ti="${i}" style="flex:1">
                  ${r.labor && !S.labores.some(l => normK(l.nombre) === normK(r.labor)) ? `<option value="${esc(r.labor)}" selected>${esc(r.labor)}</option>` : ""}
                  ${laborOpts}
                </select>
                <span class="code-pill" data-tc="cod">${esc(r.codigo || "—")}</span>
                <div class="hrs-box">
                  <button type="button" data-th="-" data-ti="${i}">−</button>
                  <input data-tf="horas" data-ti="${i}" inputmode="decimal" value="${esc(r.horas)}" />
                  <button type="button" data-th="+" data-ti="${i}">+</button>
                </div>
              </div>
            </div>
          `;
        }).join("");

        st.filas.forEach((r, i) => {
          const sel = list.querySelector(`select[data-ti="${i}"]`);
          if (sel && r.labor) sel.value = r.labor;
        });

        actualizarTotalesTareo();
      };

      const actualizarTotalesTareo = () => {
        const valid = st.filas.filter(r => r.dni.trim() || r.nombre.trim());
        const hrs = valid.reduce((a, r) => a + toNum(r.horas), 0);
        if ($("tar-cnt")) $("tar-cnt").textContent = valid.length;
        if ($("tar-hrs")) $("tar-hrs").textContent = hrs.toFixed(1).replace(/\.0$/, "");
      };

      const marcarSucioTareo = () => {
        st.dirty = true;
        store.set(cKey, { filas: st.filas, estado: st.estado, dirty: true });
        if ($("tar-badge")) { $("tar-badge").className = "badge b-bor"; $("tar-badge").textContent = "SIN GUARDAR"; }
      };

      pintarFilasTareo();

      $("tar-list").oninput = e => {
        const t = e.target;
        const idx = Number(t.dataset.ti);
        const f = t.dataset.tf;
        if (Number.isNaN(idx) || !f) return;
        const r = st.filas[idx];
        if (!r) return;
        r[f] = t.value;

        if (f === "dni") {
          const p = resolverTrabajadorPorDni(t.value);
          const card = $("tar-list").querySelector(`[data-ti="${idx}"]`);
          if (p) {
            r.nombre = p.nombre;
            r.estado = p.estado || "ACTIVO";
            if (card) {
              const nomEl = card.querySelector(`[data-tc="nom"]`);
              if (nomEl) { nomEl.textContent = p.nombre; nomEl.style.color = "var(--text)"; }
            }
          }
        }
        actualizarTotalesTareo();
        marcarSucioTareo();
      };

      $("tar-list").onchange = e => {
        const t = e.target;
        const idx = Number(t.dataset.ti);
        if (t.dataset.tf === "labor" && !Number.isNaN(idx)) {
          const r = st.filas[idx];
          r.labor = t.value;
          r.codigo = resolverCodigoLabor(r.labor, r.codigo);
          const card = $("tar-list").querySelector(`[data-ti="${idx}"]`);
          if (card) {
            const cEl = card.querySelector(`[data-tc="cod"]`);
            if (cEl) cEl.textContent = r.codigo || "—";
          }
          marcarSucioTareo();
        }
      };

      $("tar-list").onclick = e => {
        const del = e.target.closest("[data-tdel]");
        if (del) {
          st.filas.splice(Number(del.dataset.tdel), 1);
          if (!st.filas.length) st.filas.push(nuevaFilaTareo());
          marcarSucioTareo();
          pintarFilasTareo();
          return;
        }
        const hBtn = e.target.closest("[data-th]");
        if (hBtn) {
          const i = Number(hBtn.dataset.ti);
          const r = st.filas[i];
          const delta = hBtn.dataset.th === "+" ? 1 : -1;
          r.horas = String(Math.max(0, Math.min(24, toNum(r.horas) + delta)));
          const inp = $("tar-list").querySelector(`input[data-tf="horas"][data-ti="${i}"]`);
          if (inp) inp.value = r.horas;
          actualizarTotalesTareo();
          marcarSucioTareo();
        }
      };

      $("tar-add").onclick = () => {
        st.filas.push(nuevaFilaTareo());
        marcarSucioTareo();
        pintarFilasTareo();
      };

      $("tar-fecha").onchange = e => {
        if (!e.target.value) return;
        st.fecha = e.target.value;
        st.filas = [];
        st.dirty = false;
        st.estado = "NUEVO";
        renderTareo(++S.renderToken);
      };

      $("tar-folder-btn").onclick = () => abrirCarpetaTareos30Dias();

      $("tar-tpl").onclick = () => {
        if (typeof XLSX === "undefined") return toast("Cargando librería Excel...");
        const ws = XLSX.utils.aoa_to_sheet([
          ["C.LABOR", "DNI", "NOMBRES", "HORAS"],
          ["101", "72345678", "PEREZ GOMEZ JUAN CARLOS", 8]
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Tareo");
        XLSX.writeFile(wb, "Plantilla_Tareo_claude1.xlsx");
      };

      $("tar-file").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          const rows = await leerArchivoComoMatriz(f);
          let h = 0, iCod = 0, iDni = 1, iNom = 2, iHrs = 3;
          for (let i = 0; i < Math.min(rows.length, 10); i++) {
            const hs = rows[i].map(normHeader);
            const d = hs.findIndex(x => x.includes("DNI"));
            if (d >= 0) {
              h = i + 1;
              iDni = d;
              const c = hs.findIndex(x => x.includes("LABOR") || x.includes("COD"));
              const n = hs.findIndex(x => x.includes("NOM"));
              const hr = hs.findIndex(x => x.includes("HORA"));
              if (c >= 0) iCod = c;
              if (n >= 0) iNom = n;
              if (hr >= 0) iHrs = hr;
              break;
            }
          }
          const nuevas = [];
          rows.slice(h).forEach(r => {
            const dni = String(r[iDni] ?? "").replace(/\D/g, "");
            if (!dni) return;
            const cod = String(r[iCod] ?? "").trim();
            const p = resolverTrabajadorPorDni(dni);
            const labHit = S.labores.find(l => String(l.codigo) === cod);
            nuevas.push({
              dni,
              nombre: p ? p.nombre : String(r[iNom] ?? "").trim().toUpperCase(),
              estado: p ? p.estado : "ACTIVO",
              codigo: cod || (labHit ? labHit.codigo : "101"),
              labor: labHit ? labHit.nombre : (S.labores[0] ? S.labores[0].nombre : "COSECHA ARANDANO"),
              horas: String(toNum(r[iHrs]) || 8)
            });
          });
          if (!nuevas.length) return toast("No se encontraron DNIs en el archivo");
          const actuales = st.filas.filter(x => x.dni.trim());
          st.filas = [...actuales, ...nuevas];
          marcarSucioTareo();
          pintarFilasTareo();
          toast(`✓ ${nuevas.length} filas importadas`);
        } catch (err) {
          toast(err.message);
        }
        e.target.value = "";
      };

      $("tar-xls").onclick = () => {
        if (typeof XLSX === "undefined") return toast("Cargando librería Excel...");
        const valid = st.filas.filter(r => r.dni.trim());
        const aoa = [["C.LABOR", "DNI", "NOMBRES", "HORAS"]];
        valid.forEach(r => aoa.push([r.codigo, r.dni, r.nombre, toNum(r.horas)]));
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Tareo");
        XLSX.writeFile(wb, `Tareo_${st.fecha}_${S.nombre.replace(/\s+/g, "_")}.xlsx`);
      };

      $("tar-save").onclick = async () => {
        const valid = st.filas.filter(r => r.dni.trim());
        if (!valid.length) return toast("Agrega al menos un trabajador con DNI");
        const btn = $("tar-save");
        btn.disabled = true;
        btn.textContent = "Guardando...";
        const scopeNow = getUserAllowedScope();
        const fundoEnvio = scopeNow.fundos.join(", ") || S.fundo || "";
        const r = await api({
          accion: "guardarTareo",
          pin: activePin,
          usuario: S.nombre,
          rol: S.rol,
          zona: scopeNow.zonas.join(", "),
          fundo: fundoEnvio,
          fecha: st.fecha,
          filas: valid
        });
        btn.disabled = false;
        btn.textContent = "Actualizar / Guardar en Drive";
        st.dirty = false;
        st.estado = "GUARDADO";
        store.set(cKey, { filas: valid, estado: "GUARDADO", fundo: fundoEnvio, dirty: false, ts: Date.now() });
        cargarHistorial30DiasUsuario("tareos", activePin).then(h => {
          if (S.pin === activePin) { st.historial = h; if (S.activeTab === "tareo") renderTareo(++S.renderToken); }
        });
        toast(r && r.ok ? "✓ Tareo guardado/actualizado en Drive" : "⚠ Guardado en caché local");
      };

      if ($("tar-del")) {
        $("tar-del").onclick = async () => {
          if (!(await confirmar("Borrar tareo guardado", `¿Eliminar el tareo guardado del ${fmtDMY(st.fecha)}?`))) return;
          store.remove(cKey);
          await api({ accion: "guardarTareo", pin: activePin, usuario: S.nombre, fecha: st.fecha, filas: [] });
          st.filas = [nuevaFilaTareo()];
          st.estado = "NUEVO";
          st.dirty = false;
          st.historial = (st.historial || []).filter(x => x.fecha !== st.fecha);
          renderTareo(++S.renderToken);
          toast("Tareo eliminado");
        };
      }

      if (!cached || !cached.ts || (Date.now() - cached.ts) > MAESTRO_TTL_MS) {
        api({ accion: "getTareo", pin: activePin, fecha: st.fecha }).then(r => {
          if (S.renderToken !== token || S.activeTab !== "tareo" || S.pin !== activePin || st.dirty) return;
          if (r && r.ok && r.data && Array.isArray(r.data.filas) && r.data.filas.length) {
            st.filas = r.data.filas;
            st.estado = "GUARDADO";
            store.set(cKey, { filas: st.filas, estado: "GUARDADO", fundo: r.data.fundo || "", dirty: false, ts: Date.now() });
            renderTareo(token);
          }
        });
      }

      cargarHistorial30DiasUsuario("tareos", activePin).then(hist => {
        if (S.renderToken !== token || S.activeTab !== "tareo" || S.pin !== activePin) return;
        st.historial = hist;
        const fBtn = $("tar-folder-btn");
        if (fBtn) fBtn.textContent = `📁 Carpeta (${hist.length})`;
      });
    }

    // =========================================================================
    // MÓDULO 2: ASISTENCIA (CON EDICIÓN COMPLETA E HISTORIAL 30 DÍAS)
    // =========================================================================
    function nuevaFilaAsis() {
      const fundos = repFundosDisponibles();
      return {
        fundo: fundos[0] || S.fundo || "",
        grupo: "1",
        supervisor: S.nombre || "",
        cosecha: "",
        supCiclo: "",
        supCuadrilla: "",
        jabero: "",
        limpieza: "",
        riego: "",
        otros: ""
      };
    }

    const totalFilaAsis = r => ["cosecha", "supCiclo", "supCuadrilla", "jabero", "limpieza", "riego", "otros"]
      .reduce((s, k) => s + toNum(r[k]), 0);

    function renderAsistencia(token) {
      const pane = $("pane-asistencia");
      if (!pane) return;
      const st = S.asis;
      const activePin = S.pin;
      const cKey = `${CACHE.ASIS_PREFIX}${S.demo ? "demo" : "live"}_${st.fecha}_${activePin}`;
      const cached = store.get(cKey, null);
      if (!st.filas.length && cached && Array.isArray(cached.filas) && cached.filas.length) {
        st.filas = cached.filas;
        st.estado = cached.estado || "GUARDADO";
      }
      if (!st.filas.length) st.filas = [nuevaFilaAsis()];

      const fundosDisp = repFundosDisponibles();
      const badge = st.dirty ? `<span id="as-badge" class="badge b-bor">SIN GUARDAR</span>`
        : st.estado === "GUARDADO" ? `<span id="as-badge" class="badge b-env">GUARDADO (EDITABLE)</span>`
        : `<span id="as-badge" class="badge b-new">NUEVO</span>`;

      pane.innerHTML = `
        <div class="card">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row">
              <input type="date" id="as-fecha" value="${st.fecha}" />
              ${badge}
            </div>
            <span class="m">Distribución diaria editable</span>
          </div>
          <div class="row" style="flex-wrap:nowrap">
            <select id="as-hist-sel" style="flex:1;font-size:11px">
              <option value="">📅 Mis asistencias (últimos 30 días)...</option>
              ${(st.historial || []).map(h => `<option value="${esc(h.fecha)}" ${h.fecha === st.fecha ? "selected" : ""}>${esc(resumenHistorialItemTxt("asistencia", h))}</option>`).join("")}
            </select>
            <button id="as-hist-load" type="button" class="btn btn-s btn-xs">✎ Editar</button>
          </div>
        </div>

        <div class="masivo-banner">
          <div class="row sp" style="flex-wrap:nowrap">
            <div style="min-width:0;flex:1">
              <div style="font-weight:800;font-size:12px;color:var(--primary)">Masivo Asistencia</div>
              <div class="m" style="font-size:10.5px">12 columnas · Omite filas de suma automáticamente</div>
            </div>
            <label for="as-file" class="btn">📥 Masivo</label>
            <input type="file" id="as-file" accept=".xlsx,.xls,.csv,.tsv" style="display:none" />
          </div>
        </div>

        <div id="as-list"></div>

        <div class="card">
          <div class="row sp" style="margin-bottom:8px">
            <span class="m">Grupos: <b id="as-grp" style="color:var(--text)">0</b></span>
            <span class="m">Total Personal: <b id="as-tot" style="color:var(--primary)">0</b></span>
          </div>
          <button id="as-add" type="button" class="btn btn-s" style="width:100%">+ Agregar grupo</button>
          <div class="row" style="margin-top:6px;gap:6px">
            <button id="as-save" type="button" class="btn" style="flex:1">${st.estado === "GUARDADO" ? "Actualizar / Guardar en Drive" : "Guardar Asistencia en Drive"}</button>
            <button id="as-xls" type="button" class="btn btn-info">⬇ Excel</button>
            ${st.estado === "GUARDADO" ? `<button id="as-del" type="button" class="btn btn-d btn-xs">Borrar</button>` : ""}
          </div>
        </div>
      `;

      const pintarAsis = () => {
        const list = $("as-list");
        if (!list) return;
        list.innerHTML = st.filas.map((r, i) => {
          const optsF = fundosDisp.length
            ? `<select data-af="fundo" data-ai="${i}">${fundosDisp.map(f => `<option value="${esc(f)}" ${fundoKey(f) === fundoKey(r.fundo) ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`
            : `<input data-af="fundo" data-ai="${i}" placeholder="Fundo" value="${esc(r.fundo)}" />`;
          return `
            <div class="dist-card" data-acard="${i}">
              <div class="row sp" style="margin-bottom:5px">
                <span class="badge b-new">Grupo #${i + 1}</span>
                <button type="button" class="btn btn-d btn-xs" data-adel="${i}">✕</button>
              </div>
              <div class="dist-grid" style="grid-template-columns:1.2fr 0.7fr 1.3fr">
                <div class="dist-cell"><label>Fundo</label>${optsF}</div>
                <div class="dist-cell"><label>N° Grupo</label><input data-af="grupo" data-ai="${i}" value="${esc(r.grupo)}" /></div>
                <div class="dist-cell"><label>Supervisor</label><input data-af="supervisor" data-ai="${i}" value="${esc(r.supervisor)}" /></div>
              </div>
              <div class="dist-grid">
                <div class="dist-cell"><label>Cosecha</label><input data-af="cosecha" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.cosecha)}" /></div>
                <div class="dist-cell"><label>Sup.Ciclo</label><input data-af="supCiclo" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.supCiclo)}" /></div>
                <div class="dist-cell"><label>Sup.Cuad.</label><input data-af="supCuadrilla" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.supCuadrilla)}" /></div>
                <div class="dist-cell"><label>Jabero</label><input data-af="jabero" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.jabero)}" /></div>
                <div class="dist-cell"><label>Limpieza</label><input data-af="limpieza" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.limpieza)}" /></div>
                <div class="dist-cell"><label>Riego</label><input data-af="riego" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.riego)}" /></div>
                <div class="dist-cell"><label>Otros</label><input data-af="otros" data-ai="${i}" inputmode="numeric" placeholder="0" value="${esc(r.otros)}" /></div>
                <div class="dist-cell"><label>TOTAL</label><div class="dist-total-box" data-atot="${i}">${totalFilaAsis(r)}</div></div>
              </div>
            </div>
          `;
        }).join("");
        actualizarTotalesAsis();
      };

      const actualizarTotalesAsis = () => {
        if ($("as-grp")) $("as-grp").textContent = st.filas.length;
        if ($("as-tot")) $("as-tot").textContent = st.filas.reduce((s, r) => s + totalFilaAsis(r), 0);
      };

      const marcarSucioAsis = () => {
        st.dirty = true;
        store.set(cKey, { filas: st.filas, estado: st.estado, dirty: true });
        if ($("as-badge")) { $("as-badge").className = "badge b-bor"; $("as-badge").textContent = "SIN GUARDAR"; }
      };

      pintarAsis();

      $("as-list").oninput = e => {
        const t = e.target;
        const i = Number(t.dataset.ai);
        const f = t.dataset.af;
        if (Number.isNaN(i) || !f) return;
        st.filas[i][f] = t.value;
        const box = $("as-list").querySelector(`[data-atot="${i}"]`);
        if (box) box.textContent = totalFilaAsis(st.filas[i]);
        actualizarTotalesAsis();
        marcarSucioAsis();
      };

      $("as-list").onchange = e => {
        const t = e.target;
        const i = Number(t.dataset.ai);
        const f = t.dataset.af;
        if (!Number.isNaN(i) && f) {
          st.filas[i][f] = t.value;
          marcarSucioAsis();
        }
      };

      $("as-list").onclick = e => {
        const b = e.target.closest("[data-adel]");
        if (!b) return;
        st.filas.splice(Number(b.dataset.adel), 1);
        if (!st.filas.length) st.filas.push(nuevaFilaAsis());
        marcarSucioAsis();
        pintarAsis();
      };

      $("as-add").onclick = () => {
        st.filas.push(nuevaFilaAsis());
        marcarSucioAsis();
        pintarAsis();
      };

      $("as-fecha").onchange = e => {
        if (!e.target.value) return;
        st.fecha = e.target.value;
        st.filas = [];
        st.dirty = false;
        st.estado = "NUEVO";
        renderAsistencia(++S.renderToken);
      };

      const abrirFechaAsisHistorial = fSel => {
        if (!fSel) return toast("Selecciona una asistencia del historial de 30 días");
        st.fecha = fSel;
        const hit = (st.historial || []).find(x => x.fecha === fSel);
        st.filas = hit && Array.isArray(hit.filas) ? hit.filas.map(x => ({ ...x })) : [];
        st.dirty = false;
        st.estado = st.filas.length ? "GUARDADO" : "NUEVO";
        renderAsistencia(++S.renderToken);
        toast(`✓ Asistencia del ${fmtDMY(fSel)} lista para editar`);
      };

      $("as-hist-sel").onchange = e => { if (e.target.value) abrirFechaAsisHistorial(e.target.value); };
      $("as-hist-load").onclick = () => abrirFechaAsisHistorial($("as-hist-sel").value);

      $("as-file").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          const rows = await leerArchivoComoMatriz(f);
          let h = 0;
          for (let i = 0; i < Math.min(rows.length, 10); i++) {
            const hs = rows[i].map(normHeader);
            if (hs.some(x => x.includes("FUNDO")) && hs.some(x => x.includes("COSECHA"))) { h = i + 1; break; }
          }
          const imp = [];
          rows.slice(h).forEach(r => {
            const fnd = String(r[1] ?? "").trim();
            const sup = String(r[3] ?? "").trim();
            if (!fnd && !sup) return;
            if (/TOTAL|SUMA/i.test(fnd) || /TOTAL|SUMA/i.test(sup)) return;
            imp.push({
              fundo: repFundoCanon(fnd) || fnd,
              grupo: String(r[2] ?? "").trim(),
              supervisor: sup,
              cosecha: String(toNum(r[4]) || ""),
              supCiclo: String(toNum(r[5]) || ""),
              supCuadrilla: String(toNum(r[6]) || ""),
              jabero: String(toNum(r[7]) || ""),
              limpieza: String(toNum(r[8]) || ""),
              riego: String(toNum(r[9]) || ""),
              otros: String(toNum(r[10]) || "")
            });
          });
          if (!imp.length) return toast("No se detectaron filas válidas en el Excel de asistencia");
          st.filas = imp;
          marcarSucioAsis();
          pintarAsis();
          toast(`✓ ${imp.length} grupos importados`);
        } catch (err) {
          toast(err.message);
        }
        e.target.value = "";
      };

      $("as-xls").onclick = () => {
        if (typeof XLSX === "undefined") return toast("Cargando librería Excel...");
        const aoa = [["Fecha", "Fundo", "N° Grupo", "Supervisor", "Cosecha", "Sup.Ciclo", "Sup.Cuadrilla", "Jabero", "Limpieza", "Riego", "Otros", "total"]];
        st.filas.forEach(r => {
          aoa.push([
            fmtDMY(st.fecha), r.fundo, r.grupo, r.supervisor,
            toNum(r.cosecha), toNum(r.supCiclo), toNum(r.supCuadrilla),
            toNum(r.jabero), toNum(r.limpieza), toNum(r.riego), toNum(r.otros),
            totalFilaAsis(r)
          ]);
        });
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Asistencia");
        XLSX.writeFile(wb, `Asistencia_${st.fecha}.xlsx`);
      };

      $("as-save").onclick = async () => {
        const btn = $("as-save");
        btn.disabled = true;
        btn.textContent = "Guardando...";
        const scopeNow = getUserAllowedScope();
        const fundoEnvio = (st.filas[0] && st.filas[0].fundo) || scopeNow.fundos.join(", ") || S.fundo || "";
        const r = await api({
          accion: "guardarAsistencia",
          pin: activePin,
          usuario: S.nombre,
          rol: S.rol,
          zona: scopeNow.zonas.join(", "),
          fundo: fundoEnvio,
          fecha: st.fecha,
          filas: st.filas
        });
        btn.disabled = false;
        btn.textContent = "Actualizar / Guardar en Drive";
        st.dirty = false;
        st.estado = "GUARDADO";
        store.set(cKey, { filas: st.filas, estado: "GUARDADO", fundo: fundoEnvio, dirty: false, ts: Date.now() });
        cargarHistorial30DiasUsuario("asistencia", activePin).then(h => {
          if (S.pin === activePin) { st.historial = h; if (S.activeTab === "asistencia") renderAsistencia(++S.renderToken); }
        });
        toast(r && r.ok ? "✓ Asistencia guardada/actualizada en Drive" : "⚠ Guardado en caché local");
      };

      if ($("as-del")) {
        $("as-del").onclick = async () => {
          if (!(await confirmar("Borrar asistencia guardada", `¿Eliminar la asistencia guardada del ${fmtDMY(st.fecha)}?`))) return;
          store.remove(cKey);
          await api({ accion: "guardarAsistencia", pin: activePin, usuario: S.nombre, fecha: st.fecha, filas: [] });
          st.filas = [nuevaFilaAsis()];
          st.estado = "NUEVO";
          st.dirty = false;
          st.historial = (st.historial || []).filter(x => x.fecha !== st.fecha);
          renderAsistencia(++S.renderToken);
          toast("Asistencia eliminada");
        };
      }

      if (!cached || !cached.ts || (Date.now() - cached.ts) > MAESTRO_TTL_MS) {
        api({ accion: "getAsistencia", pin: activePin, fecha: st.fecha }).then(r => {
          if (S.renderToken !== token || S.activeTab !== "asistencia" || S.pin !== activePin || st.dirty) return;
          if (r && r.ok && r.data && Array.isArray(r.data.filas) && r.data.filas.length) {
            st.filas = r.data.filas;
            st.estado = "GUARDADO";
            store.set(cKey, { filas: st.filas, estado: "GUARDADO", fundo: r.data.fundo || "", dirty: false, ts: Date.now() });
            renderAsistencia(token);
          }
        });
      }

      cargarHistorial30DiasUsuario("asistencia", activePin).then(hist => {
        if (S.renderToken !== token || S.activeTab !== "asistencia" || S.pin !== activePin) return;
        st.historial = hist;
        const sel = $("as-hist-sel");
        if (sel) {
          sel.innerHTML = `<option value="">📅 Mis asistencias (últimos 30 días: ${hist.length})...</option>` +
            hist.map(h => `<option value="${esc(h.fecha)}" ${h.fecha === st.fecha ? "selected" : ""}>${esc(resumenHistorialItemTxt("asistencia", h))}</option>`).join("");
        }
      });
    }

    // =========================================================================
    // MÓDULO 3 Y 4: AJUSTE Y PROYECCIÓN (EDICIÓN + HISTORIAL 30 DÍAS + FUNDO)
    // =========================================================================
    const REP_CFG = {
      ajuste: {
        titulo: "Ajuste",
        fechaAuto: false,
        nota: "Fecha inicial hoy (puedes cambiar fecha o abrir envíos de los últimos 30 días para editarlos). Semana y Tipo van automáticos."
      },
      proyeccion: {
        titulo: "Proyección",
        fechaAuto: false,
        nota: "Fecha inicial mañana (+1 día, editable). Puedes abrir y editar cualquier envío guardado de los últimos 30 días."
      }
    };

    const REP_COLS = {
      ajuste: ["semana", "fecha", "tipo", "fundo", "modulo", "variedad", "ciclo", "formato", "destino", "dias", "ha", "kgHa", "jornales", "kilos", "kgJor"],
      proyeccion: ["semana", "fecha", "tipo", "fundo", "modulo", "variedad", "ciclo", "formato", "destino", "dias", "ha", "kgHa", "jornales", "kilos", "kgJor"]
    };

    const REP_USER_FIELDS = {
      ajuste: ["fundo", "modulo", "variedad", "ciclo", "formato", "destino", "dias", "ha", "kgHa", "jornales", "kilos", "kgJor"],
      proyeccion: ["fundo", "modulo", "variedad", "ciclo", "dias", "ha", "kgHa", "jornales", "kilos", "kgJor"]
    };

    const REP_LABEL = {
      semana: "Semana", fecha: "Fecha", tipo: "Tipo", fundo: "Fundo", modulo: "Módulo", variedad: "Variedad",
      ciclo: "Ciclo", formato: "Formato", destino: "Destino",
      dias: "Días de Reingreso", ha: "Ha", kgHa: "Kg/Ha", jornales: "Jornales (Cosechador)",
      kilos: "Kilos", kgJor: "Kg/Jornales"
    };

    const calcKilos = r => toNum(r.ha) * toNum(r.kgHa);
    const calcKgJor = r => { const j = toNum(r.jornales); return j > 0 ? calcKilos(r) / j : 0; };
    const fmtKilos = n => Math.round(n).toLocaleString("en-US");
    const fmtKgJor = n => n.toFixed(1);

    const repEsAdminAux = () => canViewConsolidated();

    function repFundosDisponibles() {
      const scope = getUserAllowedScope();
      const allCiclos = uniq(S.M.ciclos.map(c => c.fundo));
      if (scope.fundos.length) {
        if (!allCiclos.length) return scope.fundos;
        return scope.fundos.map(sf => {
          const hit = allCiclos.find(cf => fundoKey(cf) === fundoKey(sf));
          return hit || sf;
        });
      }
      if (repEsAdminAux()) return allCiclos;
      const k = fundoKey(S.fundo || S.zona);
      const mine = allCiclos.filter(f => { const fk = fundoKey(f); return fk === k || fk.startsWith(k + " "); });
      return mine.length ? mine : allCiclos;
    }

    const repDelFundo = fundo => S.M.ciclos.filter(c => fundoKey(c.fundo) === fundoKey(fundo));
    function repModulos(fundo) {
      if (!fundo) return [];
      return uniq(repDelFundo(fundo).map(c => String(c.modulo))).sort((a, b) => Number(a) - Number(b));
    }
    function repVariedades(fundo, modulo) {
      if (!fundo) return [];
      let l = repDelFundo(fundo);
      if (modKey(modulo) !== "") {
        const lm = l.filter(c => modKey(c.modulo) === modKey(modulo));
        if (lm.length) l = lm;
        else return [];
      }
      return uniq(l.map(c => c.variedad)).sort();
    }
    function repBuscarCiclo(fundo, modulo, variedad) {
      if (!fundo || modKey(modulo) === "" || !variedad) return "";
      const c = S.M.ciclos.find(x => fundoKey(x.fundo) === fundoKey(fundo) && modKey(x.modulo) === modKey(modulo) && normK(x.variedad) === normK(variedad));
      return c ? String(c.ciclo) : "";
    }
    function repFundoCanon(v) {
      const t = String(v ?? "").trim();
      if (!t) return "";
      const hit = S.M.ciclos.find(c => fundoKey(c.fundo) === fundoKey(t));
      return hit ? hit.fundo : t;
    }
    function repVariedadCanon(fundo, v) {
      const t = String(v ?? "").trim();
      const hit = repDelFundo(fundo).find(c => normK(c.variedad) === normK(t));
      return hit ? hit.variedad : t;
    }

    function repNuevaFila() {
      const f = repFundosDisponibles();
      const fDefault = f.length === 1 ? f[0] : (repEsAdminAux() ? "" : (f[0] || S.fundo));
      const mods = repModulos(fDefault);
      const mDefault = mods.length === 1 ? mods[0] : "";
      const vars = mDefault ? repVariedades(fDefault, mDefault) : [];
      const vDefault = vars.length === 1 ? vars[0] : "";
      const cDefault = repBuscarCiclo(fDefault, mDefault, vDefault);
      return {
        fundo: fDefault,
        modulo: mDefault,
        variedad: vDefault,
        ciclo: cDefault,
        formato: "",
        destino: "",
        dias: "",
        ha: "",
        kgHa: "",
        jornales: ""
      };
    }

    const repFilaEstaVacia = r => ["modulo", "variedad", "formato", "destino", "dias", "ha", "kgHa", "jornales"].every(k => String(r[k] ?? "").trim() === "");
    const repFilaNorm = r => ({
      fundo: String(r.fundo ?? ""), modulo: String(r.modulo ?? ""), variedad: String(r.variedad ?? ""),
      ciclo: String(r.ciclo ?? ""), formato: String(r.formato ?? ""), destino: String(r.destino ?? ""),
      dias: String(r.dias ?? ""), ha: String(r.ha ?? ""), kgHa: String(r.kgHa ?? ""), jornales: String(r.jornales ?? "")
    });

    const repKeyLocal = (pfx, tipo, fecha, pin) => `${pfx}${tipo}_${fecha}_${pin}`;
    function repBackendLocal() {
      return {
        key: (tipo, fecha, pin) => repKeyLocal(CACHE_REP.REP_PREFIX + "live_", tipo, fecha, pin),
        get: k => store.get(k, null),
        set: (k, v) => store.set(k, v),
        del: k => store.remove(k),
        keys: () => safeStorage.keys().filter(k => k.startsWith(CACHE_REP.REP_PREFIX + "live_")),
        mget: n => store.get(CACHE_REP.MAESTRO_PREFIX + n, null),
        mset: (n, v) => store.set(CACHE_REP.MAESTRO_PREFIX + n, v)
      };
    }
    function repBackendDemo() {
      return {
        key: (tipo, fecha, pin) => repKeyLocal("demo_", tipo, fecha, pin),
        get: k => DEMO.rep[k] || null, set: (k, v) => { DEMO.rep[k] = v; }, del: k => { delete DEMO.rep[k]; },
        keys: () => Object.keys(DEMO.rep),
        mget: n => DEMO.maestros[n] || null, mset: (n, v) => { DEMO.maestros[n] = v; }
      };
    }
    function repLocalApi(req, B) {
      const pin = String(req.pin || "").trim();
      switch (req.accion) {
        case "getMaestro": return { ok: true, data: B.mget(req.nombre) || [] };
        case "cargarMaestro": B.mset(req.nombre, req.data || []); return { ok: true, total: (req.data || []).length };
        case "getReporte": {
          const v = B.get(B.key(req.tipo, req.fecha, pin));
          return { ok: true, data: v ? { ...v, estado: "GUARDADO" } : { filas: [], estado: "NUEVO" } };
        }
        case "guardarReporte":
          B.set(B.key(req.tipo, req.fecha, pin), {
            tipo: req.tipo, fecha: req.fecha, pin, fundo: req.fundo || "", usuario: req.usuario || "",
            filas: req.filas || [], guardado: new Date().toISOString()
          });
          return { ok: true };
        case "borrarReporte": B.del(B.key(req.tipo, req.fecha, req.targetPin || pin)); return { ok: true };
        case "listarReportes": {
          const data = B.keys().map(k => B.get(k)).filter(v => v && v.tipo === req.tipo && v.fecha >= req.desde && v.fecha <= req.hasta);
          return { ok: true, data };
        }
        default: return null;
      }
    }

    async function repApi(payload) {
      const req = { pin: S.pin, rol: S.rol, ...payload };
      const r = await api(req);
      if (r && (!r.ok && (r.offline || /acci[oó]n|action|inv[aá]lid/i.test(String(r.error || ""))))) {
        const loc = repLocalApi(req, repBackendLocal());
        if (loc) return { ...loc, local: true };
      }
      return r;
    }
    const repMsgGuardado = (r, ok) => (r && (r.local || r.offline)) ? "⚠ Guardado en caché local" : ok;

    function repHydrate() {
      ["ciclos", "formatos", "destinos"].forEach(n => {
        const v = store.get(CACHE_REP.MAESTRO_PREFIX + n, []);
        S.M[n] = Array.isArray(v) ? v : [];
      });
      if (!S.M.ciclos.length) {
        S.M.ciclos = DEMO_CICLOS_RAW.map(a => ({ zona: a[0], fundo: a[1], variedad: a[2], modulo: a[3], area: a[4], ciclo: a[5] }));
      }
      if (!S.M.formatos.length) S.M.formatos = ["Granel", "Bulk", "Hand Packed", "Bulk/Granel"];
      if (!S.M.destinos.length) S.M.destinos = ["USA", "EU", "EU/USA"];
    }

    async function repSyncMaestros() {
      if (S.demo) {
        S.M = { ciclos: DEMO.maestros.ciclos.slice(), formatos: DEMO.maestros.formatos.slice(), destinos: DEMO.maestros.destinos.slice() };
        return;
      }
      const pin = S.pin;
      const nombres = ["ciclos", "formatos", "destinos"];
      const res = await Promise.all(nombres.map(n => repApi({ accion: "getMaestro", nombre: n })));
      if (S.pin !== pin) return;
      res.forEach((r, i) => {
        if (r && r.ok && Array.isArray(r.data) && r.data.length) {
          S.M[nombres[i]] = r.data;
          store.set(CACHE_REP.MAESTRO_PREFIX + nombres[i], r.data);
        }
      });
    }

    function matrizCiclosALista(rows) {
      let h = -1, m = {};
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const hs = (rows[i] || []).map(normHeader);
        const idx = {
          zona: hs.indexOf("ZONA"),
          fundo: hs.indexOf("FUNDO"),
          variedad: hs.indexOf("VARIEDAD"),
          modulo: hs.indexOf("MODULO"),
          area: hs.findIndex(x => x === "AREA" || x === "HA"),
          ciclo: hs.indexOf("CICLO")
        };
        if (idx.fundo >= 0 && idx.variedad >= 0 && idx.modulo >= 0 && idx.ciclo >= 0) { h = i; m = idx; break; }
      }
      if (h < 0) return [];
      const out = [];
      rows.slice(h + 1).forEach(r => {
        const fundo = String(r[m.fundo] ?? "").trim();
        const variedad = String(r[m.variedad] ?? "").trim();
        const ciclo = r[m.ciclo];
        if (!fundo || !variedad || String(ciclo ?? "").trim() === "") return;
        const modulo = r[m.modulo];
        out.push({
          zona: m.zona >= 0 ? String(r[m.zona] ?? "").trim() : "",
          fundo, variedad,
          modulo: typeof modulo === "number" ? modulo : (Number.isFinite(Number(modulo)) && String(modulo).trim() !== "" ? Number(modulo) : String(modulo).trim()),
          area: m.area >= 0 ? toNum(r[m.area]) : 0,
          ciclo: typeof ciclo === "number" ? ciclo : (Number.isFinite(Number(ciclo)) ? Number(ciclo) : String(ciclo).trim())
        });
      });
      return out;
    }

    function matrizReporteAFilas(rows) {
      let h = -1, idx = {};
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const m = {};
        (rows[i] || []).map(normHeader).forEach((x, c) => {
          if (m.fundo === undefined && x === "FUNDO") m.fundo = c;
          else if (m.modulo === undefined && x === "MODULO") m.modulo = c;
          else if (m.variedad === undefined && x === "VARIEDAD") m.variedad = c;
          else if (m.formato === undefined && x === "FORMATO") m.formato = c;
          else if (m.destino === undefined && x === "DESTINO") m.destino = c;
          else if (m.dias === undefined && x.startsWith("DIAS")) m.dias = c;
          else if (m.ha === undefined && x === "HA") m.ha = c;
          else if (m.kgHa === undefined && /^KG ?\/ ?HA$/.test(x)) m.kgHa = c;
          else if (m.jornales === undefined && x.startsWith("JORNAL")) m.jornales = c;
        });
        if (m.modulo !== undefined && m.variedad !== undefined) { h = i; idx = m; break; }
      }
      if (h < 0) return [];
      const base = repNuevaFila();
      const out = [];
      rows.slice(h + 1).forEach(r => {
        const g = k => idx[k] === undefined ? "" : r[idx[k]];
        const modulo = String(g("modulo") ?? "").trim();
        let variedad = String(g("variedad") ?? "").trim();
        if (modulo === "" && variedad === "") return;
        const fundo = repFundoCanon(g("fundo")) || base.fundo;
        variedad = repVariedadCanon(fundo, variedad);
        out.push({
          fundo,
          modulo,
          variedad,
          ciclo: repBuscarCiclo(fundo, modulo, variedad),
          formato: String(g("formato") ?? "").trim(),
          destino: String(g("destino") ?? "").trim(),
          dias: String(g("dias") ?? "").trim(),
          ha: String(g("ha") ?? "").trim(),
          kgHa: String(g("kgHa") ?? "").trim(),
          jornales: String(g("jornales") ?? "").trim()
        });
      });
      return out;
    }

    function repValorCol(tipo, c, r) {
      switch (c) {
        case "semana": return isoWeek(r.fecha);
        case "fecha": return fmtDMY(r.fecha);
        case "tipo": return "Cosecha";
        case "formato":
        case "destino": return r[c] || "";
        case "modulo": return modKey(r.modulo) !== "" && Number.isFinite(Number(r.modulo)) ? Number(r.modulo) : (r.modulo || "");
        case "ciclo": return String(r.ciclo ?? "") === "" ? "" : (Number.isFinite(Number(r.ciclo)) ? Number(r.ciclo) : r.ciclo);
        case "dias": case "ha": case "kgHa": case "jornales": return String(r[c] ?? "").trim() === "" ? "" : toNum(r[c]);
        case "kilos": return calcKilos(r);
        case "kgJor": return calcKgJor(r);
        default: return r[c] ?? "";
      }
    }

    function repDescargar(tipo, filas, nombreArchivo, soloNaranjas = false) {
      if (typeof XLSX === "undefined") return toast("No se cargó el lector Excel.");
      const cols = soloNaranjas ? REP_USER_FIELDS[tipo] : REP_COLS[tipo];
      const aoa = [cols.map(c => REP_LABEL[c])];
      filas.forEach(r => aoa.push(cols.map(c => repValorCol(tipo, c, r))));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = cols.map(c => ({ wch: c === "jornales" || c === "dias" ? 20 : (c === "variedad" || c === "fundo" ? 18 : 12) }));
      const fmt = { kilos: "#,##0", kgJor: "0.0", ha: "0.00" };
      cols.forEach((c, ci) => {
        if (!fmt[c]) return;
        for (let ri = 1; ri < aoa.length; ri++) {
          const cell = ws[XLSX.utils.encode_cell({ r: ri, c: ci })];
          if (cell && typeof cell.v === "number") cell.z = fmt[c];
        }
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, REP_CFG[tipo].titulo);
      XLSX.writeFile(wb, nombreArchivo);
    }

    function repAviso(r) {
      return (r.fundo && modKey(r.modulo) !== "" && r.variedad && !r.ciclo && S.M.ciclos.length) ? "Sin ciclo en el maestro" : "";
    }

    function repCampoHtml(tipo, i, k, r) {
      const dat = `data-f="${k}" data-i="${i}"`;
      const sel = (opts, val, placeholder = "—") => {
        const list = val && !opts.some(o => String(o) === String(val)) ? [val, ...opts] : opts;
        return `<select ${dat}><option value="">${placeholder}</option>${list.map(o => `<option value="${esc(o)}" ${String(o) === String(val) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      };
      const txt = (extra = "") => `<input ${dat} value="${esc(r[k])}" ${extra} />`;
      const num = () => `<input ${dat} inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(r[k])}" />`;
      switch (k) {
        case "fundo": {
          const opts = repFundosDisponibles();
          if (!opts.length) return txt(repEsAdminAux() ? "" : "disabled");
          return sel(opts, r.fundo, "— Fundo —");
        }
        case "modulo": {
          const opts = repModulos(r.fundo);
          return opts.length ? sel(opts, r.modulo, r.fundo ? "— Mód. —" : "Elige fundo") : txt(`inputmode="numeric" placeholder="Mód."`);
        }
        case "variedad": {
          const opts = repVariedades(r.fundo, r.modulo);
          return opts.length ? sel(opts, r.variedad, r.modulo ? "— Var. —" : "Elige mód.") : txt(`placeholder="Variedad"`);
        }
        case "ciclo": return `<div class="dist-total-box rep-cic" data-c="ciclo">${r.ciclo ? esc(r.ciclo) : "—"}</div>`;
        case "formato": return S.M.formatos.length ? sel(S.M.formatos, r.formato, "— Formato —") : txt();
        case "destino": return S.M.destinos.length ? sel(S.M.destinos, r.destino, "— Destino —") : txt();
        case "kilos": return `<div class="dist-total-box" data-c="kilos">${fmtKilos(calcKilos(r))}</div>`;
        case "kgJor": return `<div class="dist-total-box" data-c="kgJor">${fmtKgJor(calcKgJor(r))}</div>`;
        default: return num();
      }
    }

    function repCardHtml(tipo, i, r) {
      const campos = REP_USER_FIELDS[tipo].map(k => `<div class="dist-cell"><label>${REP_LABEL[k]}</label>${repCampoHtml(tipo, i, k, r)}</div>`).join("");
      return `
        <div class="dist-card" data-card="${i}">
          <div class="row sp">
            <span class="badge b-new">#${i + 1}</span>
            <span class="warn-txt" data-c="aviso">${repAviso(r)}</span>
            <button type="button" class="btn btn-d btn-xs" data-del="${i}" title="Quitar fila">✕</button>
          </div>
          <div class="dist-grid rep-grid">${campos}</div>
        </div>`;
    }

    const repCacheKey = (tipo, fecha) => `${CACHE_REP.REPD_PREFIX}${S.demo ? "demo" : "live"}_${tipo}_${fecha}_${S.pin}`;
    function repMarcarSucio(tipo) {
      const st = S.rep[tipo];
      st.dirty = true;
      store.set(repCacheKey(tipo, st.fecha), { filas: st.filas, estado: st.estado, dirty: true });
      const b = $("rep-badge");
      if (b) { b.className = "badge b-bor"; b.textContent = "SIN GUARDAR"; }
    }

    function repPintarTotales(tipo) {
      const el = $("rep-tot");
      if (!el) return;
      const f = S.rep[tipo].filas;
      const ha = f.reduce((s, r) => s + toNum(r.ha), 0);
      const kilos = f.reduce((s, r) => s + calcKilos(r), 0);
      const jor = f.reduce((s, r) => s + toNum(r.jornales), 0);
      el.innerHTML = `
        <div class="kpis" style="margin:0">
          <div class="kpi"><span class="m">Ha</span><b>${ha.toFixed(2)}</b></div>
          <div class="kpi"><span class="m">Kilos</span><b>${fmtKilos(kilos)}</b></div>
          <div class="kpi"><span class="m">Jornales</span><b>${jor.toLocaleString("en-US")}</b></div>
          <div class="kpi"><span class="m">Kg/Jornal</span><b>${jor > 0 ? fmtKgJor(kilos / jor) : "0.0"}</b></div>
        </div>`;
    }

    function repRefrescarCalculos(tipo, i) {
      const r = S.rep[tipo].filas[i];
      const card = $("rep-list") && $("rep-list").querySelector(`[data-card="${i}"]`);
      if (!card || !r) return;
      const set = (c, v) => { const el = card.querySelector(`[data-c="${c}"]`); if (el) el.textContent = v; };
      set("ciclo", r.ciclo || "—");
      set("kilos", fmtKilos(calcKilos(r)));
      set("kgJor", fmtKgJor(calcKgJor(r)));
      set("aviso", repAviso(r));
      repPintarTotales(tipo);
    }

    function pintarRepFilas(tipo) {
      const list = $("rep-list");
      if (!list) return;
      const st = S.rep[tipo];
      list.innerHTML = st.filas.map((r, i) => repCardHtml(tipo, i, r)).join("");
      repPintarTotales(tipo);

      list.oninput = e => {
        const t = e.target, k = t.dataset.f;
        if (k === undefined || t.tagName === "SELECT") return;
        const r = st.filas[Number(t.dataset.i)];
        if (!r) return;
        if (["dias", "ha", "kgHa", "jornales"].includes(k)) {
          const limpio = t.value.replace(",", ".").replace(/[^0-9.]/g, "");
          if (limpio !== t.value) t.value = limpio;
        }
        r[k] = t.value;
        if (["fundo", "modulo", "variedad"].includes(k)) r.ciclo = repBuscarCiclo(r.fundo, r.modulo, r.variedad);
        repRefrescarCalculos(tipo, Number(t.dataset.i));
        repMarcarSucio(tipo);
      };

      list.onchange = e => {
        const t = e.target, k = t.dataset.f;
        if (k === undefined) return;
        const r = st.filas[Number(t.dataset.i)];
        if (!r) return;
        if (t.tagName === "SELECT") r[k] = t.value;
        else if (k !== "modulo") return;

        if (k === "fundo") {
          const mods = repModulos(r.fundo);
          if (r.modulo && mods.length && !mods.includes(String(r.modulo))) r.modulo = "";
          if (!r.modulo && mods.length === 1) r.modulo = mods[0];
          const vars = r.modulo ? repVariedades(r.fundo, r.modulo) : [];
          if (r.variedad && (!vars.length || !vars.includes(r.variedad))) r.variedad = "";
          if (!r.variedad && vars.length === 1) r.variedad = vars[0];
        } else if (k === "modulo") {
          const vars = repVariedades(r.fundo, r.modulo);
          if (r.variedad && vars.length && !vars.includes(r.variedad)) r.variedad = "";
          if (!r.variedad && vars.length === 1) r.variedad = vars[0];
        }

        r.ciclo = repBuscarCiclo(r.fundo, r.modulo, r.variedad);
        repMarcarSucio(tipo);
        pintarRepFilas(tipo);
      };

      list.onclick = e => {
        const b = e.target.closest("[data-del]");
        if (!b) return;
        st.filas.splice(Number(b.dataset.del), 1);
        if (!st.filas.length) st.filas.push(repNuevaFila());
        repMarcarSucio(tipo);
        pintarRepFilas(tipo);
      };
    }

    async function cargarReporte(tipo, token) {
      const st = S.rep[tipo];
      const fecha = st.fecha;
      const activePin = S.pin;
      const r = await repApi({ accion: "getReporte", tipo, fecha, pin: activePin });
      if (S.renderToken !== token || S.activeTab !== tipo || S.pin !== activePin || st.fecha !== fecha) return false;
      if (!r || !r.ok || !r.data || st.dirty) return false;
      const filas = (r.data.filas || []).map(repFilaNorm);
      st.local = !!(r.local || r.offline);
      if (filas.length) {
        st.filas = filas;
        st.estado = "GUARDADO";
        store.set(repCacheKey(tipo, fecha), { filas, estado: "GUARDADO", dirty: false, ts: Date.now() });
      } else if (st.estado === "GUARDADO") {
        st.filas = [];
        st.estado = "NUEVO";
        store.remove(repCacheKey(tipo, fecha));
      }
      return true;
    }

    async function repCambiarFecha(tipo, nuevaFecha) {
      const st = S.rep[tipo];
      if (st.dirty && !(await confirmar("Cambiar fecha", "Tienes cambios sin guardar. ¿Descartarlos y cargar la nueva fecha?"))) {
        if ($("rep-fecha")) $("rep-fecha").value = st.fecha;
        return;
      }
      st.fecha = nuevaFecha;
      st.filas = [];
      st.estado = "NUEVO";
      st.dirty = false;
      const c = store.get(repCacheKey(tipo, nuevaFecha), null);
      if (c && Array.isArray(c.filas) && c.filas.length) {
        st.filas = c.filas.map(repFilaNorm);
        st.estado = c.estado || "GUARDADO";
      }
      renderRepIngreso(tipo);
      const token = ++S.renderToken;
      const ok = await cargarReporte(tipo, token);
      if (ok && S.renderToken === token && S.activeTab === tipo && st.vista === "mio") renderRepIngreso(tipo);
    }

    function exportarReporteImagenPreview(tipo, filasRaw, tituloExtra = "") {
      const cfg = REP_CFG[tipo];
      const cols = REP_COLS[tipo];
      const filas = (filasRaw || [])
        .filter(r => !repFilaEstaVacia(r))
        .map(r => ({
          ...repFilaNorm(r),
          fecha: r.fecha || S.rep[tipo].fecha,
          usuario: r.usuario || S.nombre || S.fundo || ""
        }));

      if (!filas.length) return toast("Agrega al menos una fila con datos para generar la imagen");

      const totHa = filas.reduce((s, r) => s + toNum(r.ha), 0);
      const totKilos = filas.reduce((s, r) => s + calcKilos(r), 0);
      const totJor = filas.reduce((s, r) => s + toNum(r.jornales), 0);
      const promKgHa = totHa > 0 ? totKilos / totHa : 0;
      const promKgJor = totJor > 0 ? totKilos / totJor : 0;

      const headerLabels = cols.map(c => {
        if (c === "dias") return "Días Reing.";
        if (c === "jornales") return "Jornales";
        return REP_LABEL[c];
      });

      const colWidths = cols.map(c => ({
        semana: 58, fecha: 82, tipo: 68, fundo: 98, modulo: 58, variedad: 108,
        ciclo: 52, formato: 86, destino: 74, dias: 72,
        ha: 64, kgHa: 74, jornales: 68, kilos: 84, kgJor: 76
      }[c] || 76));

      const bodyRows = filas.map(r => cols.map(c => {
        const v = repValorCol(tipo, c, r);
        if (c === "kilos") return fmtKilos(v);
        if (c === "kgJor") return fmtKgJor(v);
        if (c === "ha" && v !== "") return Number(v).toFixed(2);
        if (c === "kgHa" && v !== "") return Math.round(Number(v)).toLocaleString("en-US");
        return String(v ?? "");
      }));

      const totalRow = cols.map(c => {
        if (c === "semana") return "TOTAL";
        if (c === "fundo") return `${filas.length} fila(s)`;
        if (c === "ha") return totHa.toFixed(2);
        if (c === "kgHa") return totHa > 0 ? Math.round(promKgHa).toLocaleString("en-US") : "0";
        if (c === "jornales") return totJor.toLocaleString("en-US");
        if (c === "kilos") return fmtKilos(totKilos);
        if (c === "kgJor") return fmtKgJor(promKgJor);
        return "";
      });

      const allRows = [...bodyRows, totalRow];
      const padX = 20, padY = 18, titleH = 62, headH = 34, rowH = 30;
      const width = padX * 2 + colWidths.reduce((a, b) => a + b, 0);
      const height = titleH + headH + allRows.length * rowH + padY * 2;

      const canvas = document.createElement("canvas");
      canvas.width = width * 2;
      canvas.height = height * 2;
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2);

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#10b981";
      ctx.fillRect(padX, padY, width - padX * 2, 34);
      ctx.fillStyle = "#042f2e";
      ctx.font = "800 14px -apple-system, BlinkMacSystemFont, sans-serif";
      const fechaTitulo = tituloExtra || fmtDMY(S.rep[tipo].fecha);
      ctx.fillText(`${APP_NAME}  ·  ${cfg.titulo.toUpperCase()}  ·  ${fechaTitulo}`, padX + 12, padY + 22);

      ctx.fillStyle = "#a7f3d0";
      ctx.font = "700 11.5px -apple-system, BlinkMacSystemFont, sans-serif";
      const subLinea = `Usuario: ${S.nombre || S.fundo}   |   Ha: ${totHa.toFixed(2)}   |   Kilos: ${fmtKilos(totKilos)}   |   Jornales: ${totJor.toLocaleString("en-US")}   |   Kg/Jornal: ${fmtKgJor(promKgJor)}`;
      ctx.fillText(subLinea, padX, padY + 52);

      const yHead = padY + titleH;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(padX, yHead, width - padX * 2, headH);
      let xCursor = padX;
      ctx.font = "700 10px -apple-system, BlinkMacSystemFont, sans-serif";
      headerLabels.forEach((h, idx) => {
        const colKey = cols[idx];
        const isHiddenCol = !REP_USER_FIELDS[tipo].includes(colKey);
        ctx.fillStyle = isHiddenCol ? "#38bdf8" : "#34d399";
        ctx.fillText(h, xCursor + 6, yHead + 21);
        xCursor += colWidths[idx];
      });

      allRows.forEach((r, rIdx) => {
        const yRow = yHead + headH + rIdx * rowH;
        const isTot = rIdx === allRows.length - 1;
        ctx.fillStyle = isTot ? "#064e3b" : (rIdx % 2 === 0 ? "#0f172a" : "#1e293b");
        ctx.fillRect(padX, yRow, width - padX * 2, rowH);

        ctx.strokeStyle = isTot ? "rgba(52, 211, 153, 0.55)" : "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = isTot ? 1.2 : 0.6;
        ctx.beginPath();
        ctx.moveTo(padX, yRow);
        ctx.lineTo(width - padX, yRow);
        ctx.stroke();

        let cx = padX;
        r.forEach((val, cIdx) => {
          const colKey = cols[cIdx];
          const isCalc = colKey === "kilos" || colKey === "kgJor";
          ctx.fillStyle = isTot ? "#ecfdf5" : (isCalc ? "#34d399" : "#f8fafc");
          ctx.font = (isTot || isCalc || colKey === "fundo" || colKey === "variedad")
            ? "700 10.5px -apple-system, BlinkMacSystemFont, sans-serif"
            : "500 10.5px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.fillText(String(val ?? "").slice(0, 19), cx + 6, yRow + 19);
          cx += colWidths[cIdx];
        });
      });

      const dataUrl = canvas.toDataURL("image/png");
      const fileSlug = `${cfg.titulo}_${(tituloExtra || S.rep[tipo].fecha).replace(/[^0-9A-Za-z_-]/g, "_")}.png`;
      abrirModalImagen(
        `Vista previa · ${cfg.titulo}`,
        `Incluye todas las columnas (Semana, Tipo, Fundo, Formato, Destino) y totales`,
        dataUrl,
        fileSlug
      );
    }

    function repAplanar(sets) {
      const out = [];
      (sets || []).forEach(s => {
        if (!recordBelongsToScope({ fundo: s.fundo, zona: s.zona, pin: s.pin })) return;
        (s.filas || []).forEach(f => {
          const fnd = f.fundo || s.fundo || "";
          if (!recordBelongsToScope({ fundo: fnd, zona: s.zona, pin: s.pin })) return;
          out.push({ ...f, fecha: s.fecha, usuario: s.usuario || "", fundo: fnd });
        });
      });
      out.sort((a, b) => a.fecha.localeCompare(b.fecha) || fundoKey(a.fundo).localeCompare(fundoKey(b.fundo)) || (Number(a.modulo) - Number(b.modulo)) || 0);
      return out;
    }

    function repCeldaTxt(tipo, c, r) {
      const v = repValorCol(tipo, c, r);
      if (c === "kilos") return fmtKilos(v);
      if (c === "kgJor") return fmtKgJor(v);
      if (c === "ha" && v !== "") return Number(v).toFixed(2);
      return esc(v);
    }

    async function repConsultar(tipo, forceRefresh = false) {
      const st = S.rep[tipo], c = st.cons;
      const consCacheKey = `${CACHE_REP.REPCONS_PREFIX}${S.demo ? "demo" : "live"}_${tipo}_${c.desde}_${c.hasta}_${S.pin}`;
      const cachedCons = store.get(consCacheKey, null);

      if (cachedCons && Array.isArray(cachedCons.data) && !forceRefresh) {
        c.data = cachedCons.data;
        c.cargado = true;
        renderRepConsolidado(tipo, true);
        if (cachedCons.ts && (Date.now() - cachedCons.ts) < MAESTRO_TTL_MS) return;
      }

      const stEl = $("rep-cons-st");
      if (stEl) stEl.textContent = c.cargado ? "Actualizando en segundo plano..." : "Consultando...";
      const r = await repApi({ accion: "listarReportes", tipo, desde: c.desde, hasta: c.hasta });
      if (S.activeTab !== tipo || st.vista !== "cons") return;
      if (!r || !r.ok) {
        if (stEl) stEl.textContent = c.cargado ? `${c.data.length} envío(s) (caché local)` : "";
        if (!c.cargado) toast((r && r.error) || "No se pudo consultar");
        return;
      }
      c.data = Array.isArray(r.data) ? r.data : [];
      c.local = !!(r.local || r.offline);
      c.cargado = true;
      store.set(consCacheKey, { data: c.data, ts: Date.now() });
      renderRepConsolidado(tipo, true);
    }

        <div class="kpis">
          <div class="kpi"><span class="m">Ha</span><b>${ha.toFixed(2)}</b></div>
          <div class="kpi"><span class="m">Kilos</span><b>${fmtKilos(kilos)}</b></div>
          <div class="kpi"><span class="m">Jornales</span><b>${jor.toLocaleString("en-US")}</b></div>
          <div class="kpi"><span class="m">Kg/Jornal</span><b>${jor > 0 ? fmtKgJor(kilos / jor) : "0.0"}</b></div>

      $("rc-hasta").onchange = e => { c.hasta = e.target.value || c.hasta; if (c.hasta < c.desde) c.desde = c.hasta; c.cargado = false; renderRepConsolidado(tipo); };
      $("rc-go").onclick = () => repConsultar(tipo, true);
      $("rc-img").onclick = () => exportarReporteImagenPreview(tipo, filas, `${fmtDMY(c.desde)}${c.hasta !== c.desde ? " al " + fmtDMY(c.hasta) : ""}`);
      $("rc-xls").onclick = () => repDescargar(tipo, filas, `${cfg.titulo}_${c.desde}${c.hasta !== c.desde ? "_a_" + c.hasta : ""}.xlsx`, false);
      if (!c.cargado && !skipAutoFetch) repConsultar(tipo, false);
    }

    async function abrirReporte(tipo, token) {
      const st = S.rep[tipo];
      if (!st.vistaInit) { st.vista = repEsAdminAux() ? "cons" : "mio"; st.vistaInit = true; }
      const c = store.get(repCacheKey(tipo, st.fecha), null);
      const hasCache = !!(c && Array.isArray(c.filas) && c.filas.length);
      if (hasCache && !st.filas.length) {
        st.filas = c.filas.map(repFilaNorm);
        st.estado = c.estado || "NUEVO";
        st.dirty = !!c.dirty;
      }
      renderReporteShell(tipo);
      if (st.vista === "mio") {
        const isFresh = hasCache && c.ts && (Date.now() - c.ts) < MAESTRO_TTL_MS && !st.dirty;
        if (isFresh) return;
        const ok = await cargarReporte(tipo, token);
        if (ok && S.renderToken === token && S.activeTab === tipo && st.vista === "mio") renderRepIngreso(tipo);
      }
    }
