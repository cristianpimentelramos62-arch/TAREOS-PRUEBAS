<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Sistema de Tareos · AgroBerries</title>
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/png" href="./image/png/agb-logo.png" />
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-veil"></div>

  <div class="topbar">
    <div class="sync-box">
      <span id="sync-dot" class="dot"></span>
      <span id="sync-ind">Script (Drive)</span>
    </div>
    <button id="btn-theme" type="button" class="theme-btn">☀️ Claro</button>
    <div class="mode-pill">
      <button id="m-script" type="button">Inicio</button>
      <button id="m-demo" type="button">Qas</button>
    </div>
  </div>

  <div id="menu-bd"></div>
  <aside id="menu-dr"></aside>
  <div id="app"></div>
  <div id="toast"></div>

  <div id="folder-modal" class="overlay">
    <div class="modal-box">
      <div class="row sp">
        <div>
          <div style="font-weight:800;font-size:14px">Tareos · Últimos 30 días</div>
          <div id="folder-sub" class="m" style="font-size:10.5px">Selecciona un tareo guardado para editarlo</div>
        </div>
        <div class="row">
          <button id="folder-ref" type="button" class="btn btn-inf btn-xs">↻</button>
          <button id="folder-x" type="button" class="btn btn-s btn-xs">✕</button>
        </div>
      </div>
      <div id="folder-list" style="overflow-y:auto;margin-top:8px"></div>
    </div>
  </div>

  <div id="confirm-modal" class="overlay">
    <div class="modal-box" style="max-width:360px">
      <div id="c-title" style="font-weight:800;font-size:14px;margin-bottom:6px">Confirmar</div>
      <div id="c-body" class="m" style="margin-bottom:14px;line-height:1.45"></div>
      <div class="row" style="justify-content:flex-end">
        <button id="c-no" type="button" class="btn btn-s">Cancelar</button>
        <button id="c-yes" type="button" class="btn">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="img-modal" class="overlay">
    <div class="modal-box" style="max-width:720px">
      <div class="row sp">
        <div>
          <div id="im-title" style="font-weight:800;font-size:13.5px">Vista previa</div>
          <div id="im-sub" class="m" style="font-size:10.5px">Desliza horizontalmente para ver columnas y totales</div>
        </div>
        <button id="im-x" type="button" class="btn btn-s btn-xs">✕</button>
      </div>
      <div id="img-scroll"><img id="im-prev" alt="Reporte" /></div>
      <div class="row" style="justify-content:flex-end">
        <button id="im-close" type="button" class="btn btn-s">Cerrar</button>
        <button id="im-dl" type="button" class="btn">Descargar Imagen</button>
      </div>
    </div>
  </div>

  <script defer src="js/app.js"></script>
</body>
</html>
