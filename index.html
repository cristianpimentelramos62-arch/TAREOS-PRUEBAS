        const el = $(id);
        if (!el) return;
        const arr = S.M[key];
        el.innerHTML = arr.length
          ? arr.map((v, i) => `<span class="badge b-new" style="display:inline-flex;align-items:center;gap:4px">${esc(v)} <button type="button" data-k="${key}" data-i="${i}" style="all:unset;cursor:pointer;color:var(--danger);font-weight:800">✕</button></span>`).join("")
          : `<span class="m">Sin elementos</span>`;
        el.querySelectorAll("button").forEach(b => {
          b.onclick = async () => {
            S.M[key].splice(Number(b.dataset.i), 1);
            store.set(CACHE_REP.MAESTRO_PREFIX + key, S.M[key]);
            pintarLista(id, key);
            const r = await repApi({ accion: "cargarMaestro", nombre: key, data: S.M[key] });
            if (r && !r.ok) toast(r.error);
          };
        });
      };
      const enlazarAdd = (inId, btnId, chipId, key) => {
        if (!$(btnId)) return;
        $(btnId).onclick = async () => {
          const v = $(inId).value.trim();
          if (!v) return;
          if (!S.M[key].some(x => normK(x) === normK(v))) S.M[key].push(v);
          $(inId).value = "";
          store.set(CACHE_REP.MAESTRO_PREFIX + key, S.M[key]);
          pintarLista(chipId, key);
          const r = await repApi({ accion: "cargarMaestro", nombre: key, data: S.M[key] });
          toast(r && r.ok ? repMsgGuardado(r, "Guardado en Drive") : ((r && r.error) || "Error"));
        };
      };
      pintarLista("mf-chips", "formatos");
      pintarLista("md-chips", "destinos");
      enlazarAdd("mf-in", "mf-add", "mf-chips", "formatos");
      enlazarAdd("md-in", "md-add", "md-chips", "destinos");

      if ($("fc")) {
        $("fc").onchange = async e => {
          const f = e.target.files[0];
          if (!f) return;
          try {
            $("mc-s").textContent = `Leyendo ${f.name}...`;
            const list = matrizCiclosALista(await leerArchivoComoMatriz(f));
            if (!list.length) { $("mc-s").textContent = ""; return toast("No se detectaron columnas Zona, Fundo, Variedad, Módulo y Ciclo"); }
            $("mc-s").textContent = `Reemplazando BD Ciclos (${list.length} filas)...`;
            const r = await repApi({ accion: "cargarMaestro", nombre: "ciclos", data: list });
            if (!r || !r.ok) { $("mc-s").textContent = ""; return toast((r && r.error) || "Error al subir"); }
            S.M.ciclos = list;
            store.set(CACHE_REP.MAESTRO_PREFIX + "ciclos", list);
            $("mc-n").textContent = list.length;
            $("mc-s").textContent = `✓ BD Ciclos actualizada: ${list.length} combinaciones`;
            toast(repMsgGuardado(r, `✓ ${list.length} ciclos cargados`));
          } catch (err) { $("mc-s").textContent = ""; toast(err.message); }
          e.target.value = "";
        };
      }
    }

    // =========================================================================
    // MÓDULO 5: CONSOLIDADOS GLOBALES (TAREOS, ASISTENCIA, AJUSTE Y PROYECCIÓN)
    // =========================================================================
    async function renderConsolidados(token) {
      const pane = $("pane-resumen");
      if (!pane) return;
      const rs = S.resumen;
      const activePin = S.pin;

      const tiposConsolidado = [
        { id: "tareos", label: "📋 Tareos" },
        { id: "asistencia", label: "👥 Asistencia" },
        { id: "ajuste", label: "⚖️ Ajuste" },
        { id: "proyeccion", label: "📈 Proyección" }
      ];

      pane.innerHTML = `
        <div class="card">
          <div class="tabs" id="res-tipo-btns" style="margin-bottom:8px">
            ${tiposConsolidado.map(t => `<button type="button" data-rtipo="${t.id}" class="${rs.tipo === t.id ? "active" : ""}">${t.label}</button>`).join("")}
          </div>
          <div class="row sp" style="margin-bottom:6px">
            <div class="row">
              <input type="date" id="res-desde" value="${rs.desde}" />
              <span class="m">a</span>
              <input type="date" id="res-hasta" value="${rs.hasta}" />
            </div>
            <div class="row">
              <button id="res-go" type="button" class="btn btn-xs">Consultar</button>
              <button id="res-refresh-all" type="button" class="btn btn-w btn-xs">↻ Actualizar todo</button>
              <button id="res-xls" type="button" class="btn btn-info btn-xs">⬇ Excel</button>
              <button id="res-xls-all" type="button" class="btn btn-s btn-xs">⬇ Todo Excel</button>
            </div>
          </div>
          <div id="res-st" class="m"></div>
        </div>
        <div id="res-body"></div>
      `;

      const obtenerFundoUsuario = pin => {
        const u = (S.users || []).find(x => String(x.pin).trim() === String(pin || "").trim());
        return u && u.fundo ? u.fundo : "";
      };

      const construirFilasTareos = raw => {
        const rows = [];
        (raw || [])
          .filter(item => recordBelongsToScope({ fundo: item.fundo, zona: item.zona, pin: item.pin }))
          .forEach(env => {
            const fundoEnv = env.fundo || obtenerFundoUsuario(env.pin) || env.zona || "";
            (env.filas || []).forEach(f => {
              rows.push({
                fecha: env.fecha,
                fundo: f.fundo || fundoEnv,
                zona: env.zona || "",
                codigo: f.codigo || "",
                dni: f.dni || "",
                nombre: f.nombre || "",
                labor: f.labor || "",
                horas: toNum(f.horas)
              });
            });
          });
        return rows;
      };

      const construirFilasAsis = raw => {
        const rows = [];
        (raw || [])
          .filter(item => recordBelongsToScope({ fundo: item.fundo, zona: item.zona, pin: item.pin }))
          .forEach(env => {
            const fundoEnv = env.fundo || obtenerFundoUsuario(env.pin) || "";
            (env.filas || []).forEach(f => {
              const fnd = f.fundo || fundoEnv;
              if (!recordBelongsToScope({ fundo: fnd, zona: env.zona, pin: env.pin })) return;
              rows.push({ fecha: env.fecha, ...f, fundo: fnd });
            });
          });
        return rows;
      };

      const pintarTabla = () => {
        const body = $("res-body");
        if (!body) return;

        if (rs.tipo === "tareos") {
          const rows = construirFilasTareos(rs.data);
          const totHrs = rows.reduce((s, x) => s + x.horas, 0);
          body.innerHTML = `
            <div class="kpis">
              <div class="kpi"><span class="m">Registros Tareo</span><b>${rows.length}</b></div>
              <div class="kpi"><span class="m">Horas Totales</span><b>${totHrs.toFixed(1).replace(/\.0$/, "")}</b></div>
            </div>
            <div class="card">
              <div class="table-wrap">
                <table class="res-tbl">
                  <thead><tr><th>Fecha</th><th>C.LABOR</th><th>DNI</th><th>NOMBRES</th><th>LABOR</th><th>HORAS</th><th>FUNDO</th></tr></thead>
                  <tbody>
                    ${rows.length ? rows.map(r => `<tr><td>${fmtDMY(r.fecha)}</td><td><b>${esc(r.codigo)}</b></td><td>${esc(r.dni)}</td><td>${esc(r.nombre)}</td><td>${esc(r.labor)}</td><td>${r.horas}</td><td><b>${esc(r.fundo)}</b></td></tr>`).join("") : `<tr><td colspan="7" class="m">Sin tareos en este rango.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          `;
          $("res-xls").onclick = () => {
            if (typeof XLSX === "undefined" || !rows.length) return toast("Sin datos para exportar");
            const aoa = [["FECHA", "C.LABOR", "DNI", "NOMBRES", "LABOR", "HORAS", "FUNDO"]];
            rows.forEach(r => aoa.push([fmtDMY(r.fecha), r.codigo, r.dni, r.nombre, r.labor, r.horas, r.fundo]));
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Consolidado_Tareos");
            XLSX.writeFile(wb, `Consolidado_Tareos_${rs.desde}_a_${rs.hasta}.xlsx`);
          };
        } else if (rs.tipo === "asistencia") {
          const rows = construirFilasAsis(rs.data);
          const totPers = rows.reduce((s, r) => s + totalFilaAsis(r), 0);
          body.innerHTML = `
            <div class="kpis">
              <div class="kpi"><span class="m">Grupos</span><b>${rows.length}</b></div>
              <div class="kpi"><span class="m">Total Asistencia</span><b>${totPers}</b></div>
            </div>
            <div class="card">
              <div class="table-wrap">
                <table class="res-tbl" style="min-width:680px">
                  <thead><tr><th>Fecha</th><th>Fundo</th><th>Grupo</th><th>Supervisor</th><th>Cosecha</th><th>Sup.Ciclo</th><th>Sup.Cuad</th><th>Jabero</th><th>Limpieza</th><th>Riego</th><th>Otros</th><th>Total</th></tr></thead>
                  <tbody>
                    ${rows.length ? rows.map(r => `<tr><td>${fmtDMY(r.fecha)}</td><td><b>${esc(r.fundo)}</b></td><td>${esc(r.grupo)}</td><td>${esc(r.supervisor)}</td><td>${toNum(r.cosecha)}</td><td>${toNum(r.supCiclo)}</td><td>${toNum(r.supCuadrilla)}</td><td>${toNum(r.jabero)}</td><td>${toNum(r.limpieza)}</td><td>${toNum(r.riego)}</td><td>${toNum(r.otros)}</td><td><b>${totalFilaAsis(r)}</b></td></tr>`).join("") : `<tr><td colspan="12" class="m">Sin asistencias en este rango.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          `;
          $("res-xls").onclick = () => {
            if (typeof XLSX === "undefined" || !rows.length) return toast("Sin datos para exportar");
            const aoa = [["Fecha", "Fundo", "N° Grupo", "Supervisor", "Cosecha", "Sup.Ciclo", "Sup.Cuadrilla", "Jabero", "Limpieza", "Riego", "Otros", "total"]];
            rows.forEach(r => aoa.push([fmtDMY(r.fecha), r.fundo, r.grupo, r.supervisor, toNum(r.cosecha), toNum(r.supCiclo), toNum(r.supCuadrilla), toNum(r.jabero), toNum(r.limpieza), toNum(r.riego), toNum(r.otros), totalFilaAsis(r)]));
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Consolidado_Asistencia");
            XLSX.writeFile(wb, `Consolidado_Asistencia_${rs.desde}_a_${rs.hasta}.xlsx`);
          };
        } else {
          const repTipo = rs.tipo;
          const filas = repAplanar(rs.data);
          const cols = REP_COLS[repTipo];
          const ha = filas.reduce((s, r) => s + toNum(r.ha), 0);
          const kilos = filas.reduce((s, r) => s + calcKilos(r), 0);
          const jor = filas.reduce((s, r) => s + toNum(r.jornales), 0);

          body.innerHTML = `
            <div class="kpis">
              <div class="kpi"><span class="m">Ha (${REP_CFG[repTipo].titulo})</span><b>${ha.toFixed(2)}</b></div>
              <div class="kpi"><span class="m">Kilos</span><b>${fmtKilos(kilos)}</b></div>
              <div class="kpi"><span class="m">Jornales</span><b>${jor.toLocaleString("en-US")}</b></div>
              <div class="kpi"><span class="m">Kg/Jornal</span><b>${jor > 0 ? fmtKgJor(kilos / jor) : "0.0"}</b></div>
            </div>
            <div class="card">
              <div class="table-wrap">
                <table class="res-tbl" style="min-width:${cols.length * 70}px">
                  <thead><tr>${cols.map(k => `<th>${REP_LABEL[k]}</th>`).join("")}</tr></thead>
                  <tbody>
                    ${filas.length ? filas.map(r => `<tr>${cols.map(k => `<td>${repCeldaTxt(repTipo, k, r)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}" class="m">Sin registros de ${REP_CFG[repTipo].titulo} en este rango.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          `;
          $("res-xls").onclick = () => {
            if (!filas.length) return toast("Sin datos para exportar");
            repDescargar(repTipo, filas, `Consolidado_${REP_CFG[repTipo].titulo}_${rs.desde}_a_${rs.hasta}.xlsx`, false);
          };
        }
      };

      const consultar = async (force = false) => {
        const tipoActual = rs.tipo;
        const ck = `${CACHE.RESUMEN_PREFIX}${S.demo ? "demo" : "live"}_${tipoActual}_${rs.desde}_${rs.hasta}_${activePin}`;
        const cached = store.get(ck, null);
        if (cached && Array.isArray(cached.data) && !force) {
          rs.data = cached.data;
          pintarTabla();
          if (cached.ts && (Date.now() - cached.ts) < MAESTRO_TTL_MS) return;
        }
        if ($("res-st")) $("res-st").textContent = "Consultando Drive...";

        const r = (tipoActual === "tareos" || tipoActual === "asistencia")
          ? await api({ accion: "listarConsolidado", pin: activePin, tipo: tipoActual, desde: rs.desde, hasta: rs.hasta })
          : await repApi({ accion: "listarReportes", tipo: tipoActual, desde: rs.desde, hasta: rs.hasta });

        if (S.renderToken !== token || S.activeTab !== "resumen" || S.pin !== activePin || rs.tipo !== tipoActual) return;
        if (r && r.ok) {
          rs.data = r.data || [];
          store.set(ck, { data: rs.data, ts: Date.now() });
          if ($("res-st")) $("res-st").textContent = `${rs.data.length} envío(s) encontrados`;
          pintarTabla();
        } else {
          if ($("res-st")) $("res-st").textContent = "";
        }
      };

      $("res-xls-all").onclick = async () => {
        if (typeof XLSX === "undefined") return toast("Cargando librería Excel...");
        const btnAll = $("res-xls-all");
        btnAll.disabled = true;
        btnAll.textContent = "Exportando...";
        toast("Recopilando Tareos, Asistencia, Ajuste y Proyección...");

        const [rTar, rAsis, rAj, rProy] = await Promise.all([
          api({ accion: "listarConsolidado", pin: activePin, tipo: "tareos", desde: rs.desde, hasta: rs.hasta }),
          api({ accion: "listarConsolidado", pin: activePin, tipo: "asistencia", desde: rs.desde, hasta: rs.hasta }),
          repApi({ accion: "listarReportes", tipo: "ajuste", desde: rs.desde, hasta: rs.hasta }),
          repApi({ accion: "listarReportes", tipo: "proyeccion", desde: rs.desde, hasta: rs.hasta })
        ]);

        btnAll.disabled = false;
        btnAll.textContent = "⬇ Todo Excel";

        const rowsTar = construirFilasTareos((rTar && rTar.data) || []);
        const rowsAsis = construirFilasAsis((rAsis && rAsis.data) || []);
        const rowsAj = repAplanar((rAj && rAj.data) || []);
        const rowsProy = repAplanar((rProy && rProy.data) || []);

        const wb = XLSX.utils.book_new();

        const aoaTar = [["FECHA", "C.LABOR", "DNI", "NOMBRES", "LABOR", "HORAS", "FUNDO"]];
        rowsTar.forEach(r => aoaTar.push([fmtDMY(r.fecha), r.codigo, r.dni, r.nombre, r.labor, r.horas, r.fundo]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaTar), "Tareos");

        const aoaAsis = [["Fecha", "Fundo", "N° Grupo", "Supervisor", "Cosecha", "Sup.Ciclo", "Sup.Cuadrilla", "Jabero", "Limpieza", "Riego", "Otros", "total"]];
        rowsAsis.forEach(r => aoaAsis.push([fmtDMY(r.fecha), r.fundo, r.grupo, r.supervisor, toNum(r.cosecha), toNum(r.supCiclo), toNum(r.supCuadrilla), toNum(r.jabero), toNum(r.limpieza), toNum(r.riego), toNum(r.otros), totalFilaAsis(r)]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaAsis), "Asistencia");

        const aoaAj = [REP_COLS.ajuste.map(c => REP_LABEL[c])];
        rowsAj.forEach(r => aoaAj.push(REP_COLS.ajuste.map(c => repValorCol("ajuste", c, r))));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaAj), "Ajuste");

        const aoaProy = [REP_COLS.proyeccion.map(c => REP_LABEL[c])];
        rowsProy.forEach(r => aoaProy.push(REP_COLS.proyeccion.map(c => repValorCol("proyeccion", c, r))));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaProy), "Proyeccion");

        XLSX.writeFile(wb, `Consolidado_Completo_${rs.desde}_a_${rs.hasta}.xlsx`);
        toast("✓ Libro Excel completo descargado (4 hojas)");
      };

      $("res-tipo-btns").onclick = e => {
        const btn = e.target.closest("[data-rtipo]");
        if (!btn) return;
        const nuevoTipo = btn.dataset.rtipo;
        if (rs.tipo === nuevoTipo) return;
        rs.tipo = nuevoTipo;
        rs.data = [];
        $("res-tipo-btns").querySelectorAll("[data-rtipo]").forEach(b => {
          b.classList.toggle("active", b.dataset.rtipo === nuevoTipo);
        });
        consultar(false);
      };
      $("res-desde").onchange = e => { rs.desde = e.target.value || rs.desde; if (rs.desde > rs.hasta) rs.hasta = rs.desde; };
      $("res-hasta").onchange = e => { rs.hasta = e.target.value || rs.hasta; if (rs.hasta < rs.desde) rs.desde = rs.hasta; };
      $("res-go").onclick = () => consultar(true);

      $("res-refresh-all").onclick = async () => {
        const btnAll = $("res-refresh-all");
        if (btnAll) { btnAll.disabled = true; btnAll.innerHTML = `<span class="spinning">↻</span> Actualizando...`; }
        if ($("res-st")) $("res-st").textContent = "Descargando Tareos, Asistencia, Ajuste y Proyección desde Drive...";

        const modeTag = S.demo ? "demo" : "live";
        ["tareos", "asistencia", "ajuste", "proyeccion"].forEach(tp => {
          store.remove(`${CACHE.RESUMEN_PREFIX}${modeTag}_${tp}_${rs.desde}_${rs.hasta}_${activePin}`);
          store.remove(`${CACHE_REP.REPCONS_PREFIX}${modeTag}_${tp}_${rs.desde}_${rs.hasta}_${activePin}`);
        });

        const [rTar, rAsis, rAj, rProy] = await Promise.all([
          api({ accion: "listarConsolidado", pin: activePin, tipo: "tareos", desde: rs.desde, hasta: rs.hasta }),
          api({ accion: "listarConsolidado", pin: activePin, tipo: "asistencia", desde: rs.desde, hasta: rs.hasta }),
          repApi({ accion: "listarReportes", tipo: "ajuste", desde: rs.desde, hasta: rs.hasta }),
          repApi({ accion: "listarReportes", tipo: "proyeccion", desde: rs.desde, hasta: rs.hasta })
        ]);

        if (S.renderToken !== token || S.activeTab !== "resumen" || S.pin !== activePin) return;

        const now = Date.now();
        const mapResp = {
          tareos: (rTar && rTar.ok) ? (rTar.data || []) : null,
          asistencia: (rAsis && rAsis.ok) ? (rAsis.data || []) : null,
          ajuste: (rAj && rAj.ok) ? (rAj.data || []) : null,
          proyeccion: (rProy && rProy.ok) ? (rProy.data || []) : null
        };

        Object.entries(mapResp).forEach(([tp, arr]) => {
          if (arr !== null) {
            store.set(`${CACHE.RESUMEN_PREFIX}${modeTag}_${tp}_${rs.desde}_${rs.hasta}_${activePin}`, { data: arr, ts: now });
          }
        });

        if (mapResp.ajuste !== null && S.rep.ajuste) {
          S.rep.ajuste.cons = { desde: rs.desde, hasta: rs.hasta, data: mapResp.ajuste, cargado: true, local: false };
        }
        if (mapResp.proyeccion !== null && S.rep.proyeccion) {
          S.rep.proyeccion.cons = { desde: rs.desde, hasta: rs.hasta, data: mapResp.proyeccion, cargado: true, local: false };
        }

        if (mapResp[rs.tipo] !== null) {
          rs.data = mapResp[rs.tipo];
        }

        if (btnAll) { btnAll.disabled = false; btnAll.textContent = "↻ Actualizar todo"; }
        if ($("res-st")) {
          $("res-st").textContent = `✓ 4 reportes actualizados · Tareos: ${(mapResp.tareos || []).length} | Asis: ${(mapResp.asistencia || []).length} | Ajuste: ${(mapResp.ajuste || []).length} | Proy: ${(mapResp.proyeccion || []).length}`;
        }
        pintarTabla();
        toast("✓ Todos los reportes actualizados en tiempo real");
      };

      pintarTabla();
      consultar(false);
    }

    // =========================================================================
    // ARRANQUE INMEDIATO (0ms) GARANTIZADO
    // =========================================================================
    function bootstrapApp() {
      try {
        hydrateFromCache();
        applyBg(store.getRaw(CACHE.BG, ""));
        initTopbar();
        renderLogin();
      } catch (err) {
        console.error("Error de arranque:", err);
        const app = document.getElementById("app");
        if (app) {
          app.innerHTML = `<div class="login-wrap"><div class="card login-card"><b>Error al iniciar</b><p class="m">${esc(err.message)}</p></div></div>`;
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootstrapApp);
    } else {
      bootstrapApp();
    }
  </script>
</body>
</html>
