<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Sistema de Tareos · AgroBerries</title>
  <!-- defer evita que la descarga externa bloquee el primer pintado del login -->
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --topbar-bg: rgba(15, 23, 42, 0.96);
      --card: #1e293b;
      --card-solid: #1e293b;
      --card-subtle: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --border-strong: #10b981;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-fg: #042f2e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --info: #0ea5e9;
      --input: #0f172a;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.22);
      --scheme: dark;
    }

    body.light-theme {
      --bg: #f8fafc;
      --topbar-bg: rgba(255, 255, 255, 0.96);
      --card: #ffffff;
      --card-solid: #ffffff;
      --card-subtle: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --border-strong: #059669;
      --primary: #059669;
      --primary-dark: #047857;
      --primary-fg: #ffffff;
      --warn: #d97706;
      --danger: #dc2626;
      --info: #0284c7;
      --input: #f8fafc;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      --scheme: light;
    }

    body.has-bg {
      --card: rgba(30, 41, 59, 0.92);
      --input: rgba(15, 23, 42, 0.92);
    }

    body.light-theme.has-bg {
      --card: rgba(255, 255, 255, 0.94);
      --input: rgba(248, 250, 252, 0.95);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      font: 12.5px/1.38 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      min-height: 100dvh;
    }

    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #bg-veil {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    body.has-bg #bg-veil {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.88));
    }

    body.light-theme.has-bg #bg-veil {
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.78), rgba(248, 250, 252, 0.9));
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
      font-size: 11px;
      color: var(--muted);
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 25;
    }

    .sync-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .dot.warn {
      background: var(--warn);
    }

    #sync-indicator {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      color: var(--text);
    }

    .theme-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card-subtle);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      cursor: pointer;
    }

    .mode-pill {
      flex-shrink: 0;
      display: inline-flex;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }

    .mode-pill button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      cursor: pointer;
    }

    .mode-pill button.on-script {
      background: var(--primary);
      color: var(--primary-fg);
    }

    .mode-pill button.on-demo {
      background: var(--warn);
      color: #ffffff;
    }

    .wrap {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 10px 44px;
    }

    .card {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 11px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-title {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub {
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
    }

    .sp { justify-content: space-between; }
    .m { font-size: 11px; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
    }

    input[type="date"] {
      width: auto;
      padding: 4px 7px;
      font-size: 11.5px;
      color-scheme: var(--scheme);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    input:disabled, select:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    button.btn, label.btn {
      font: inherit;
      font-size: 11.5px;
      font-weight: 700;
      border: 0;
      border-radius: 9px;
      padding: 7px 11px;
      cursor: pointer;
      background: var(--primary);
      color: var(--primary-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
    }

    button.btn:active, label.btn:active { transform: scale(0.98); }
    button.btn:hover, label.btn:hover { background: var(--primary-dark); color: #fff; }
    button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
    button.btn-s, label.btn-s { background: var(--card-subtle); color: var(--text); border: 1px solid var(--border); }
    button.btn-w { background: var(--warn); color: #ffffff; }
    button.btn-d { background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.35); }
    button.btn-info, label.btn-info { background: rgba(14, 165, 233, 0.12); color: var(--info); border: 1px solid rgba(14, 165, 233, 0.35); }
    button.btn-xs, label.btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 7px; }

    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      margin-bottom: 8px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tabs button {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }

    #menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: none;
    }

    #menu-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(335px, 88vw);
      background: var(--card-solid);
      border-left: 1px solid var(--border);
      z-index: 55;
      display: none;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.35);
      padding: 14px 12px calc(18px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .menu-sec-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      margin: 12px 0 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--border);
    }

    .menu-item-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 5px;
    }

    .menu-item-btn:hover, .menu-item-btn.active-menu {
      background: rgba(16, 185, 129, 0.14);
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-pane {
      display: none !important;
      width: 100%;
    }

    .tab-pane.active-pane {
      display: block !important;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .b-new { background: var(--card-subtle); color: var(--muted); border: 1px solid var(--border); }
    .b-bor { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.35); }
    .b-env { background: rgba(16, 185, 129, 0.14); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.35); }
    .b-role { background: rgba(14, 165, 233, 0.14); color: var(--info); border: 1px solid rgba(14, 165, 233, 0.35); }

    .chips-box {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 34px;
    }

    .sel-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .sel-chip.on {
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--primary);
      color: var(--primary);
    }

    .masivo-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 12px;
      padding: 9px 11px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }

    .t-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 9px;
      margin-bottom: 6px;
    }

    .t-top {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .t-num {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .t-top input.dni-in {
      font-size: 11.5px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 4px 7px;
    }

    .t-name {
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 5px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--card-subtle);
      min-height: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      flex-wrap: wrap;
    }

    .t-bot {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .t-bot select {
      font-size: 10.5px;
      padding: 5px 6px;
    }

    .code-pill {
      flex-shrink: 0;
      min-width: 46px;
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 800;
      padding: 5px 4px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.14);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .hrs-box {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--input);
      overflow: hidden;
    }

    .hrs-box button {
      border: 0;
      background: transparent;
      color: var(--text);
      font-weight: 800;
      font-size: 13px;
      width: 24px;
      height: 27px;
      cursor: pointer;
    }

    .hrs-box input {
      width: 34px;
      border: 0;
      background: transparent;
      text-align: center;
      padding: 4px 1px;
      font-size: 11px;
      font-weight: 800;
    }

    .dist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 9px;
      margin-bottom: 6px;
    }

    .dist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .dist-cell label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dist-cell input {
      font-size: 11px;
      padding: 4px 4px;
      text-align: center;
      font-weight: 700;
    }

    .dist-total-box {
      background: rgba(16, 185, 129, 0.14);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 5px;
      text-align: center;
    }

    .warn-txt { color: var(--warn); font-size: 10px; font-weight: 700; }

    .excel-drop {
      border: 1.5px dashed var(--primary);
      background: var(--card-subtle);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      display: block;
      margin-bottom: 8px;
    }

    .labor-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
    }

    .labor-table th {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      padding: 4px 3px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .labor-table td {
      padding: 4px 2px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .labor-table input.l-nom {
      font-size: 10.8px;
      font-weight: 600;
      padding: 5px 5px;
      text-transform: uppercase;
    }

    .labor-table input.l-cod {
      font-size: 10.8px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      padding: 5px 3px;
      text-align: center;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.res-tbl {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
    }

    table.res-tbl th, table.res-tbl td {
      padding: 5px 6px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px;
    }

    table.res-tbl th {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .kpi b { display: block; font-size: 15px; margin-top: 2px; color: var(--primary); }

    .login-wrap {
      width: 100%;
      max-width: 356px;
      margin: 8vh auto 0;
      padding: 0 12px;
    }

    .login-card {
      padding: 20px 16px;
      text-align: center;
      border-color: var(--border-strong);
    }

    .login-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .login-row input {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.26em;
      padding: 9px 8px;
    }

    .login-row button {
      flex-shrink: 0;
      padding: 9px 13px;
    }

    .login-sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--card-subtle);
      border: 1px solid var(--border);
    }

    @keyframes spinIcon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spinning {
      display: inline-block;
      animation: spinIcon 0.75s linear infinite;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .keypad button {
      border: 1px solid var(--border);
      background: var(--card-subtle);
      color: var(--text);
      border-radius: 9px;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .keypad button:active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--primary);
    }

    #toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: 400px;
      margin: 0 auto;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--card-solid);
      border: 1px solid var(--primary);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      display: none;
      z-index: 80;
      text-align: center;
    }

    #folder-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #folder-modal .folder-box {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      max-height: 82dvh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    #folder-list {
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 2px;
    }

    .folder-item {
      border: 1px solid var(--border);
      background: var(--card-subtle);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .folder-item.active-item {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.08);
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 65;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #modal .box {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 360px;
      width: 100%;
      padding: 15px;
    }

    .rep-grid { grid-template-columns: repeat(3, 1fr); gap: 6px 5px; }
    .dist-cell select { font-size: 11px; padding: 4px 3px; font-weight: 700; text-overflow: ellipsis; }
    .dist-cell .dist-total-box { padding: 5px 4px; }
    .dist-cell .rep-cic { color: var(--danger); background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.30); }

    #img-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 75;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #img-modal .img-box {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 720px;
      width: 100%;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    #img-preview-scroll {
      overflow: auto;
      border-radius: 10px;

        delete window.__MEM_STORE[k];

      const p = String(iso || "").split("-").map(Number);
      if (p.length < 3 || p.some(isNaN)) return "";
      const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
      dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
      const y0 = Date.UTC(dt.getUTCFullYear(), 0, 1);
      return Math.ceil(((dt - y0) / 86400000 + 1) / 7);

      if (isAdmin()) {
        return { zonas: ["TODAS"], fundos: getAllFundosFromMaster() };
      }
      const zonas = S.zonas && S.zonas.length ? S.zonas : parseListField(S.zona);
      let fundos = S.fundos && S.fundos.length ? S.fundos : parseListField(S.fundo);
      if (!fundos.length && zonas.length) {
        fundos = getFundosByZonas(zonas);
      }
      return { zonas, fundos };
    }

    function recordBelongsToScope(rec) {
      if (isAdmin()) return true;
      if (!canViewConsolidated()) {
        if (rec && rec.pin && String(rec.pin).trim() !== String(S.pin).trim()) return false;
      }
      const scope = getUserAllowedScope();
      const recFundo = fundoKey(rec.fundo || "");
      const recZona = normK(rec.zona || "");

      if (scope.fundos.length && recFundo) {
        return scope.fundos.some(f => fundoKey(f) === recFundo);
      }
      if (scope.zonas.length) {
        if (recZona && scope.zonas.some(z => normK(z) === recZona)) return true;
        if (recFundo) {
          const zFundos = getFundosByZonas(scope.zonas);
          return zFundos.some(f => fundoKey(f) === recFundo);
        }
      }
      return true;
    }

    const IN_FLIGHT = new Map();

    function setSyncStatus(txt, isWarn = false) {

    function demoApiHandler(payload) {
      const acc = payload.accion;
      if (acc === "login" || acc === "validarPin") {
        const pin = String(payload.pin || "").trim();
        const u = DEMO.users.find(x => String(x.pin) === pin);
        if (!u) return { ok: false, error: "PIN no registrado en modo Demo" };
        return { ok: true, usuario: { ...u } };
      }
      if (acc === "getDatosIniciales" || acc === "syncMaestros") {
        return {
          ok: true,
          personal: DEMO.personal,
          labores: DEMO.labores,
          usuarios: DEMO.users,
          zonasFundos: DEMO.zonasFundos,
          ciclos: DEMO.maestros.ciclos,
          formatos: DEMO.maestros.formatos,
          destinos: DEMO.maestros.destinos
        };
      }
      if (acc === "listarUsuarios") return { ok: true, usuarios: DEMO.users, data: DEMO.users };
      if (acc === "guardarUsuario") {
        const idx = DEMO.users.findIndex(x => String(x.pin) === String(payload.pinActual || payload.pin));
        const obj = {
          pin: String(payload.nuevoPin || payload.pin || "").trim(),
          nombre: String(payload.nombre || "").trim(),
          rol: normalizeRole(payload.rol || payload.perfil, payload.nuevoPin || payload.pin),
          zona: String(payload.zona || "").trim(),
          zonas: parseListField(payload.zonas || payload.zona),
          fundo: String(payload.fundo || "").trim(),
          fundos: parseListField(payload.fundos || payload.fundo)
        };
        if (idx >= 0) DEMO.users[idx] = obj;
        else DEMO.users.push(obj);
        return { ok: true, usuarios: DEMO.users };
      }
      if (acc === "eliminarUsuario") {
        DEMO.users = DEMO.users.filter(x => String(x.pin) !== String(payload.targetPin));
        return { ok: true, usuarios: DEMO.users };
      }
      if (acc === "cargarPersonal") { DEMO.personal = payload.data || []; return { ok: true }; }
      if (acc === "cargarLabores") { DEMO.labores = payload.data || []; return { ok: true }; }
      if (acc === "getTareo") {
        const k = `${payload.fecha}_${payload.pin}`;
        return { ok: true, data: DEMO.tareos[k] || { filas: [], estado: "NUEVO" } };
      }
      if (acc === "guardarTareo") {
        const k = `${payload.fecha}_${payload.pin}`;
        DEMO.tareos[k] = {
          fecha: payload.fecha, pin: payload.pin, usuario: payload.usuario,
          zona: payload.zona, fundo: payload.fundo, filas: payload.filas || [], estado: "GUARDADO"
        };
        return { ok: true };
      }
      if (acc === "getAsistencia") {
        const k = `${payload.fecha}_${payload.pin}`;
        return { ok: true, data: DEMO.asistencia[k] || { filas: [], estado: "NUEVO" } };
      }
      if (acc === "guardarAsistencia") {
        const k = `${payload.fecha}_${payload.pin}`;
        DEMO.asistencia[k] = {
          fecha: payload.fecha, pin: payload.pin, usuario: payload.usuario,
          zona: payload.zona, fundo: payload.fundo, filas: payload.filas || [], estado: "GUARDADO"
        };
        return { ok: true };
      }
      if (acc === "listarConsolidado") {
        const src = payload.tipo === "asistencia" ? Object.values(DEMO.asistencia) : Object.values(DEMO.tareos);
        const list = src.filter(x => x.fecha >= payload.desde && x.fecha <= payload.hasta);
        return { ok: true, data: list };
      }
      const repRes = repLocalApi(payload, repBackendDemo());
      if (repRes) return repRes;
      return { ok: true };
    }

    async function api(payload, opts = {}) {
      if (S.demo) return demoApiHandler(payload);

      const isWrite = /^(guardar|cargar|eliminar|borrar)/i.test(String(payload.accion || ""));
      const timeoutMs = opts.timeout || (isWrite ? 14000 : 7500);
      const dedupKey = !isWrite ? JSON.stringify(payload) : "";

      if (dedupKey && IN_FLIGHT.has(dedupKey)) {
        return IN_FLIGHT.get(dedupKey);
      }

      const fetchWithTimeout = async (url, init, ms) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          const res = await fetch(url, { ...init, signal: ctrl.signal });
          clearTimeout(timer);
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (_) {
            throw new Error("El script devolvió HTML o texto no válido");
          }
          return data;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      };

      const run = (async () => {
        let lastErr = null;

        if (!isWrite) {
          try {
            const qs = encodeURIComponent(JSON.stringify(payload));
            const sep = SCRIPT_URL.includes("?") ? "&" : "?";
            const data = await fetchWithTimeout(`${SCRIPT_URL}${sep}q=${qs}`, {
              method: "GET",
              redirect: "follow"
            }, timeoutMs);
            setSyncStatus(S.pin ? `Drive OK · ${S.nombre}` : "Script (Drive)", false);
            return data;
          } catch (e1) {
            lastErr = e1;
          }

          try {
            const data = await fetchWithTimeout(SCRIPT_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload),
              redirect: "follow"
            }, Math.min(timeoutMs, 6000));
            setSyncStatus(S.pin ? `Drive OK · ${S.nombre}` : "Script (Drive)", false);
            return data;
          } catch (e2) {
            lastErr = e2;
          }
        } else {
          try {
            const data = await fetchWithTimeout(SCRIPT_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload),
              redirect: "follow"
            }, timeoutMs);
            setSyncStatus(S.pin ? `Drive OK · ${S.nombre}` : "Script (Drive)", false);
            return data;
          } catch (eWrite) {
            lastErr = eWrite;
          }
        }

        const errMsg = lastErr && lastErr.name === "AbortError"
          ? "Tiempo de espera agotado con Drive"
          : (lastErr && lastErr.message ? lastErr.message : "Error de red con Drive");
        setSyncStatus("Sin conexión a Drive (caché)", true);
        return { ok: false, offline: true, error: errMsg };
      })().finally(() => {
        if (dedupKey) IN_FLIGHT.delete(dedupKey);
      });

      if (dedupKey) IN_FLIGHT.set(dedupKey, run);
      return run;
    }

    function mergeUsersList(incoming) {
      const map = new Map();
      (S.users || []).forEach(u => {
        if (u && u.pin) map.set(String(u.pin).trim(), u);
      });
      (incoming || []).forEach(u => {
        if (!u || !u.pin) return;
        const pin = String(u.pin).trim();
        const prev = map.get(pin) || {};
        const zonas = parseListField(u.zonas && u.zonas.length ? u.zonas : (u.zona || prev.zona));
        const fundos = parseListField(u.fundos && u.fundos.length ? u.fundos : (u.fundo || prev.fundo));
        map.set(pin, {
          pin,
          nombre: u.nombre || prev.nombre || `Usuario ${pin}`,
          rol: normalizeRole(u.rol || u.perfil || prev.rol, pin),
          zona: zonas.join(", ") || (pin === ADMIN_CODE ? "TODAS" : ""),
          zonas: pin === ADMIN_CODE ? ["TODAS"] : zonas,
          fundo: fundos.join(", ") || (pin === ADMIN_CODE ? "TODOS" : ""),
          fundos: pin === ADMIN_CODE ? ["TODOS"] : fundos
        });
      });
      if (!map.has(ADMIN_CODE)) {
        map.set(ADMIN_CODE, {
          pin: ADMIN_CODE, nombre: "Administrador Maestro", rol: "admin",
          zona: "TODAS", zonas: ["TODAS"], fundo: "TODOS", fundos: ["TODOS"]
        });
      }
      S.users = [...map.values()];
      store.set(CACHE.USERS, S.users);
    }

    // =========================================================================
    // DESCARGA EN TIEMPO REAL SOLO DE USUARIOS (AL TOQUE EN EL LOGIN)
    // =========================================================================
    async function refrescarUsuariosTiempoReal(silencioso = false) {
      if (S.demo) {
        mergeUsersList(DEMO.users);
        if (!silencioso) toast(`✓ ${S.users.length} usuarios listos`);
        return S.users;
      }

      setSyncStatus("Descargando usuarios...", false);
      const [r1, r2, r3] = await Promise.all([
        api({ accion: "listarUsuarios" }, { timeout: 6500 }),
        api({ accion: "getMaestro", nombre: "usuarios_acl" }, { timeout: 6500 }),
        api({ accion: "getMaestro", nombre: "usuarios" }, { timeout: 6500 })
      ]);

      let totalRecibidos = 0;
      let detalleError = "";
      [r1, r2, r3].forEach(r => {
        if (r && !r.ok && r.error && !detalleError) detalleError = r.error;
        const lista = Array.isArray(r?.usuarios) ? r.usuarios : (Array.isArray(r?.data) ? r.data : null);
        if (r && r.ok && Array.isArray(lista) && lista.length) {
          mergeUsersList(lista);
          totalRecibidos = Math.max(totalRecibidos, lista.length);
        }
      });

      const hint = $("login-hint");
      if (hint) {
        hint.innerHTML = totalRecibidos > 0
          ? `Sincronizados: <b>${S.users.length} usuario(s)</b>`
          : `En caché: <b>${S.users.length} usuario(s)</b>`;
      }

      if (totalRecibidos > 0) {
        setSyncStatus(S.pin ? `Drive OK · ${S.nombre}` : `Usuarios OK (${S.users.length})`, false);
        if (!silencioso) toast(`✓ ${totalRecibidos} usuario(s) actualizados al toque`);
      } else {
        setSyncStatus("Usando usuarios en caché", true);
        if (!silencioso) toast(`⚠ ${detalleError || "No se pudo conectar a Drive"}; usando caché`);
      }

      return S.users;
    }

    // =========================================================================
    // SINCRONIZACIÓN DE MAESTROS EN SEGUNDO PLANO (DESPUÉS DE INGRESAR)
    // =========================================================================
    async function syncAllBackground(force = false) {
      if (S.demo) {
        S.personal = DEMO.personal.slice();
        S.labores = DEMO.labores.slice();
        S.users = DEMO.users.slice();
        S.zonasFundos = DEMO.zonasFundos.slice();
        S.M = {
          ciclos: DEMO.maestros.ciclos.slice(),
          formatos: DEMO.maestros.formatos.slice(),
          destinos: DEMO.maestros.destinos.slice()
        };
        rebuildIndexes();
        return;
      }

      const activePinAtStart = S.pin;
      const meta = store.get(CACHE.META_MAESTROS, { ts: 0 });
      const fresh = !force && meta.ts && (Date.now() - meta.ts) < MAESTRO_TTL_MS;
      if (fresh) {
        setSyncStatus(`Drive OK (caché) · ${S.nombre}`, false);
        return;
      }

      setSyncStatus("Descargando catálogos...", false);
      const [rInit, rUsersAcl, rZF] = await Promise.all([
        api({ accion: "getDatosIniciales", pin: activePinAtStart }),
        api({ accion: "getMaestro", nombre: "usuarios_acl", pin: activePinAtStart }),
        api({ accion: "getMaestro", nombre: "zonas_fundos", pin: activePinAtStart })
      ]);

      if (S.pin !== activePinAtStart) return;

      if (rInit && rInit.ok) {
        if (Array.isArray(rInit.personal) && rInit.personal.length) {
          S.personal = rInit.personal;
          store.set(CACHE.PERSONAL, S.personal);
        }
        if (Array.isArray(rInit.labores) && rInit.labores.length) {
          S.labores = rInit.labores;
          store.set(CACHE.LABORES, S.labores);
        }
        if (Array.isArray(rInit.usuarios) && rInit.usuarios.length) {
          mergeUsersList(rInit.usuarios);
        }
        if (Array.isArray(rInit.ciclos) && rInit.ciclos.length) {
          S.M.ciclos = rInit.ciclos;
          store.set(CACHE_REP.MAESTRO_PREFIX + "ciclos", S.M.ciclos);
        }
        if (Array.isArray(rInit.formatos) && rInit.formatos.length) {
          S.M.formatos = rInit.formatos;
          store.set(CACHE_REP.MAESTRO_PREFIX + "formatos", S.M.formatos);
        }
        if (Array.isArray(rInit.destinos) && rInit.destinos.length) {
          S.M.destinos = rInit.destinos;
          store.set(CACHE_REP.MAESTRO_PREFIX + "destinos", S.M.destinos);
        }
        store.set(CACHE.META_MAESTROS, { ts: Date.now() });
      }

      if (rUsersAcl && rUsersAcl.ok && Array.isArray(rUsersAcl.data) && rUsersAcl.data.length) {
        mergeUsersList(rUsersAcl.data);
      }

      if (rZF && rZF.ok && Array.isArray(rZF.data) && rZF.data.length) {
        S.zonasFundos = rZF.data;
        store.set(CACHE.ZONAS_FUNDOS, S.zonasFundos);
      }

      rebuildIndexes();
      await repSyncMaestros();
      if (S.pin === activePinAtStart) {
        setSyncStatus(`Drive OK · ${S.nombre}`, false);
      }
    }

    function applyUserSession(u) {
      const pin = String(u.pin || "").trim();
      S.pin = pin;
      S.nombre = u.nombre || (pin === ADMIN_CODE ? "Administrador Maestro" : `Usuario ${pin}`);
      S.rol = normalizeRole(u.rol || u.perfil, pin);
      resetUserWorkspaceState();
      const zonas = parseListField(u.zonas && u.zonas.length ? u.zonas : u.zona);
      const fundos = parseListField(u.fundos && u.fundos.length ? u.fundos : u.fundo);
      S.zonas = isAdmin() ? ["TODAS"] : zonas;
      S.zona = isAdmin() ? "TODAS" : zonas.join(", ");
      S.fundos = isAdmin() ? ["TODOS"] : fundos;
      S.fundo = isAdmin() ? "TODOS" : fundos.join(", ");
      store.set(CACHE.AUTH_PREFIX + pin, {
        pin: S.pin, nombre: S.nombre, rol: S.rol,
        zona: S.zona, zonas: S.zonas, fundo: S.fundo, fundos: S.fundos, ts: Date.now()
      });
    }

    async function doLogin(rawPin) {
      const pin = String(rawPin || "").trim();
      if (pin.length < 4) return toast("Ingresa un PIN válido (4 a 8 dígitos)");

      const btn = $("btn-login");
      if (btn) { btn.disabled = true; btn.textContent = "..."; }

      let userHit = (S.users || []).find(u => String(u.pin).trim() === pin);

      if (!userHit && !S.demo) {
        await refrescarUsuariosTiempoReal(true);
        userHit = (S.users || []).find(u => String(u.pin).trim() === pin);
      }

      if (!userHit) {
        const r = await api({ accion: "login", pin }, { timeout: 5000 });
        if (r && r.ok && r.usuario) {
          mergeUsersList([r.usuario]);
          userHit = (S.users || []).find(u => String(u.pin).trim() === pin) || r.usuario;
        }
      }

      if (btn) { btn.disabled = false; btn.textContent = "Entrar"; }

      if (!userHit) {
        return toast("PIN no encontrado. Pulsa '↻ Actualizar usuarios' para traer usuarios nuevos.");
      }

      applyUserSession(userHit);
      renderShell();

      setTimeout(() => {
        if (S.pin === pin) {
          syncAllBackground(true);
        }
      }, 20);
    }

      const ejecutarActualizacionUsuarios = async () => {
        const b1 = $("btn-refresh-users");
        const b2 = $("btn-refresh-users-txt");
        if (b1) { b1.disabled = true; b1.innerHTML = `<span class="spinning">↻</span>`; }

      $("btn-refresh-users").onclick = ejecutarActualizacionUsuarios;

            doLogin(inp.value);
          }
        }
      };

      setTimeout(() => { try { inp.focus(); } catch (_) {} }, 50);

      if (!S.demo) {
        refrescarUsuariosTiempoReal(true);
      }
    }

    // =========================================================================
    // HISTORIAL DE ÚLTIMOS 30 DÍAS POR USUARIO (PARA EDITAR CUALQUIER ENVÍO)
    // =========================================================================
    function obtenerHistorialLocalUsuario(modulo, pin) {
      const pfxMap = {
        tareos: `${CACHE.TAREO_PREFIX}${S.demo ? "demo" : "live"}_`,
        asistencia: `${CACHE.ASIS_PREFIX}${S.demo ? "demo" : "live"}_`,
        ajuste: `${CACHE_REP.REPD_PREFIX}${S.demo ? "demo" : "live"}_ajuste_`,
        proyeccion: `${CACHE_REP.REPD_PREFIX}${S.demo ? "demo" : "live"}_proyeccion_`
      };
      const pfx = pfxMap[modulo];
      const desde = isoHaceDias(30);
      const hasta = isoManana();
      const map = new Map();

      safeStorage.keys().forEach(k => {
        if (!k.startsWith(pfx) || !k.endsWith("_" + pin)) return;
        const rest = k.slice(pfx.length, k.length - ("_" + pin).length);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(rest)) return;
        if (rest < desde || rest > hasta) return;
        const obj = store.get(k, null);
        if (obj && Array.isArray(obj.filas) && obj.filas.length) {
          map.set(rest, {
            fecha: rest,
            pin,
            fundo: obj.fundo || S.fundo || "",
            filas: obj.filas
          });
        }
      });
      return [...map.values()];
    }

    async function cargarHistorial30DiasUsuario(modulo, pin) {
      const desde = isoHaceDias(30);
      const hasta = isoManana();
      const locales = obtenerHistorialLocalUsuario(modulo, pin);
      const map = new Map();
      locales.forEach(item => map.set(item.fecha, item));

      let r = null;
      if (modulo === "tareos" || modulo === "asistencia") {
        r = await api({ accion: "listarConsolidado", pin, tipo: modulo, desde, hasta }, { timeout: 6500 });
      } else {
        r = await repApi({ accion: "listarReportes", tipo: modulo, desde, hasta, pin });
      }

      if (r && r.ok && Array.isArray(r.data)) {
        r.data.forEach(item => {
          if (!item || String(item.pin || "").trim() !== String(pin).trim()) return;
          if (!Array.isArray(item.filas) || !item.filas.length) return;
          map.set(item.fecha, item);
        });
      }

      return [...map.values()].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    }

    function resumenHistorialItemTxt(modulo, item) {
      const filas = item.filas || [];
      const fnd = item.fundo || (filas[0] && filas[0].fundo) || S.fundo || "Sin fundo";
      if (modulo === "tareos") {
        const hrs = filas.reduce((s, r) => s + toNum(r.horas), 0);
        return `${fmtDMY(item.fecha)} · ${fnd} · ${filas.length} trab. (${hrs.toFixed(1).replace(/\.0$/, "")}h)`;
      }
      if (modulo === "asistencia") {
        const pers = filas.reduce((s, r) => s + totalFilaAsis(r), 0);
        return `${fmtDMY(item.fecha)} · ${fnd} · ${filas.length} grp (${pers} pers.)`;
      }
      const kg = filas.reduce((s, r) => s + calcKilos(r), 0);
      return `${fmtDMY(item.fecha)} · ${fnd} · ${filas.length} fila(s) (${fmtKilos(kg)} kg)`;
    }

    // LECTOR DE ARCHIVOS EXCEL / CSV
    // =========================================================================
    function leerArchivoComoMatriz(file) {
      return new Promise((resolve, reject) => {
        if (typeof XLSX === "undefined") {
          return reject(new Error("El lector Excel aún está cargando. Intenta en 2 segundos."));
        }
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array", cellDates: false });
            const sheetName = wb.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
            resolve(rows);
          } catch (err) {
            reject(new Error("No se pudo leer el archivo: " + err.message));
          }
        };
        reader.onerror = () => reject(new Error("Error leyendo el archivo local"));
        reader.readAsArrayBuffer(file);
      });
    }

        const map = new Map();
        S.M.ciclos.forEach(c => {
          const z = String(c.zona || "General").trim();
          const f = String(c.fundo || "").trim();
          if (!f) return;
          if (!map.has(z)) map.set(z, new Set());
          map.get(z).add(f);
        });
        S.zonasFundos = [...map.entries()].map(([zona, set]) => ({ zona, fundos: [...set] }));
        pintarZF();
        toast("✓ Zonas y fundos extraídos de BD Ciclos");
      };

      $("zf-save").onclick = async () => {
        store.set(CACHE.ZONAS_FUNDOS, S.zonasFundos);

            const s = hs.findIndex(x => x.includes("EST") || x.includes("COND"));

          $("fp-st").textContent = "";
          toast(err.message);
        }
        e.target.value = "";
      };
